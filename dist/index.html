<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mintfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pine:#10302b;--verdigris:#2c6f62;--patina:#6fb7a2;--brass:#e0b552;--copper:#b9744a;--parch:#f1e8d0;--azure:#58a6e6;--cinnabar:#e4573f;--ink:#0a2420;--disp:Forum,Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--pine);overflow:hidden;overscroll-behavior:none;touch-action:none;color:var(--parch);font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-weight:500}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--pine)}
canvas#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--parch);outline-offset:2px}
h1,h2,h3,p{margin:0;font-weight:inherit}
.hide{display:none!important}
.scroll{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}

/* Struck metal surfaces */
.plate{background:linear-gradient(165deg,#1b4d43 0,#123a33 55%,#0d2c27 100%);border-radius:16px;box-shadow:inset 0 0 0 1.5px rgba(224,181,82,.6),inset 0 0 0 4px rgba(8,28,25,.75),inset 0 0 0 5px rgba(224,181,82,.2),0 10px 26px rgba(0,0,0,.45)}
.go{height:50px;padding:0 26px;border-radius:25px;color:#2a1c06;font-family:var(--disp);font-size:24px;text-shadow:0 1px 0 rgba(255,244,205,.55);background:repeating-linear-gradient(90deg,rgba(84,54,8,.42) 0 1.5px,transparent 1.5px 4.5px) left/16px 100% no-repeat,repeating-linear-gradient(90deg,rgba(84,54,8,.42) 0 1.5px,transparent 1.5px 4.5px) right/16px 100% no-repeat,linear-gradient(180deg,#f8df95 0,#dba942 52%,#b98527 100%);box-shadow:0 3px 0 #7c5513,0 8px 14px rgba(0,0,0,.32),inset 0 0 0 1.5px rgba(255,244,205,.5)}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #7c5513,0 3px 6px rgba(0,0,0,.3),inset 0 0 0 1.5px rgba(255,244,205,.5)}
.ghost{min-height:46px;padding:0 18px;border-radius:23px;font-size:17px;font-weight:600;color:var(--parch);background:rgba(8,28,25,.42);box-shadow:inset 0 0 0 1.5px var(--patina)}
.ghost:active{background:rgba(111,183,162,.26)}
.seg{display:flex;align-items:center;gap:3px;font-size:15px}
.seg>span{color:var(--patina);margin-right:5px}
.seg button{min-width:44px;min-height:38px;padding:0 11px;border-radius:19px;color:#c9e0d5;font-weight:600}
.seg button[aria-pressed=true]{background:radial-gradient(circle at 35% 25%,#fdeeb9,#dfb04c 62%,#b98527);color:#2a1c06;box-shadow:inset 0 0 0 1.5px rgba(122,82,16,.7),0 1px 3px rgba(0,0,0,.4)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{display:block;width:8px;height:8px;border-radius:50%;background:rgba(4,16,14,.55);box-shadow:inset 0 0 0 1px rgba(224,181,82,.55)}
.pips i.on{background:radial-gradient(circle at 35% 30%,#fff0bd,#e0b552 60%,#a87a20);box-shadow:0 0 0 .5px rgba(70,44,6,.8)}

/* Title */
#title{position:absolute;inset:0;display:block;width:100%;height:100%;text-align:left;overflow:hidden;background:radial-gradient(110% 150% at 30% 50%,#3f917f 0,#25635a 32%,#133b34 68%,#0a2622 100%)}
#title::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 50%,rgba(255,255,255,.03) 0 2px,transparent 2px 17px)}
#tcan{position:absolute;inset:0;width:100%;height:100%;display:block}
.tword{position:absolute;left:58%;top:50%;transform:translateY(-50%)}
.tword b{display:block;font-family:var(--disp);font-weight:400;font-size:92px;line-height:.95;color:var(--parch);text-shadow:0 2px 0 rgba(4,16,14,.55),0 -1px 0 rgba(255,255,255,.2)}
.tword em{display:block;font-style:normal;font-size:22px;font-weight:600;color:var(--brass);margin-top:10px;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.tword em{animation:none}}

/* Lobby */
#lobby{position:absolute;inset:0;display:grid;grid-template-columns:24% minmax(0,1fr) 32%;grid-template-rows:40px minmax(0,1fr) auto;gap:4px 14px;padding:8px 44px;background:radial-gradient(120% 140% at 14% 42%,#3b8a78 0,#225a50 34%,#123a33 72%,#0c2a26 100%)}
#lobby::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 13% 42%,rgba(255,255,255,.028) 0 2px,transparent 2px 15px);pointer-events:none}
#lobby>*{position:relative;min-width:0;min-height:0}
.ltop{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ltop h1{font-family:var(--disp);font-size:30px;line-height:1;text-shadow:0 1px 0 rgba(4,16,14,.6)}
.ltop>div{display:flex;align-items:center;gap:8px}
.tok{min-height:38px;padding:0 14px;border-radius:19px;font-size:15px;font-weight:600;background:rgba(8,28,25,.42);box-shadow:inset 0 0 0 1.5px rgba(224,181,82,.55)}
.mission{flex:1;font-size:17px;font-weight:600;color:var(--parch);white-space:nowrap}
.mission b{font-family:var(--disp);font-weight:400;font-size:21px;margin-right:7px}
.mission.t0 b{color:#8cc7f2}.mission.t1 b{color:#f59a86}
#call{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#call .plate{padding:14px 40px 16px;text-align:center;animation:callin 2.2s both}
#call h2{font-family:var(--disp);font-size:42px;line-height:1}
#call p{font-size:20px;font-weight:600;color:var(--brass);margin-top:5px}
@keyframes callin{0%{transform:scale(.4);opacity:0}12%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}84%{transform:scale(1);opacity:1}100%{transform:scale(.92);opacity:0}}
@media (prefers-reduced-motion:reduce){#call .plate{animation:none}}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.hero canvas#big{flex:1 1 0;min-height:0;max-width:100%;aspect-ratio:1;display:block}
.ladder{display:flex;gap:4px;align-items:center;justify-content:center}
.rung{width:30px;height:30px;border-radius:50%;padding:2.5px;position:relative;opacity:.38;filter:saturate(.35)}
.rung canvas{display:block;width:100%;height:100%}
.rung.done{opacity:1;filter:none}
.rung.now{opacity:1;filter:none;background:conic-gradient(var(--brass) calc(var(--p)*1%),rgba(4,16,14,.55) 0)}
.lad{font-size:14px;font-weight:600;color:var(--brass);text-align:center;line-height:1.1;white-space:nowrap}
.who{display:flex;flex-direction:column;gap:4px;justify-content:center}
.nm{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.nm h2{font-family:var(--disp);font-size:34px;line-height:1;text-shadow:0 1px 0 rgba(4,16,14,.6)}
.tags{display:flex;gap:4px}
.tags span{font-size:13.5px;font-weight:600;padding:1px 8px;border-radius:9px;background:rgba(8,28,25,.5);color:#d3e6dc;box-shadow:inset 0 0 0 1px rgba(111,183,162,.55)}
.blurb{font-size:15px;color:#cde4d9;line-height:1.1}
.abil{display:grid;gap:3px}
.abil>div{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:7px;align-items:center;font-size:13.5px;line-height:1.1;color:#d9e7dc}
.abil img{width:34px;height:34px;display:block}
.abil em{font-style:normal;color:var(--brass);font-weight:700;margin-right:4px}
.abil u{text-decoration:none;font-size:13px;color:var(--patina);font-weight:600;white-space:nowrap}
.stats{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 7px;align-items:center;font-size:13px;color:#bcd8cc;line-height:1}
.stats i{display:block;height:5px;border-radius:3px;background:rgba(4,16,14,.5);overflow:hidden}
.stats i b{display:block;height:100%;background:linear-gradient(90deg,#b98527,#f4d27c)}
.arng{font-size:13px;color:var(--patina);font-weight:600;line-height:1.1}
.picks{grid-column:1/3;display:flex;gap:8px;align-items:center;padding-top:2px}
.pick{width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border-radius:12px;transition:transform .12s}
.pick canvas{width:48px;height:48px;display:block}
.pick[aria-pressed=true]{transform:translateY(-2px) scale(1.08);background:rgba(224,181,82,.15);box-shadow:inset 0 0 0 1.5px rgba(224,181,82,.7)}
.side{grid-column:3;grid-row:2/4;display:flex;flex-direction:column;justify-content:center;gap:7px}
.team h3{font-size:15px;font-weight:700;line-height:1.1;margin-bottom:2px}
.team.t0 h3{color:#8cc7f2}.team.t1 h3{color:#f59a86}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.seat{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.seatc{position:relative;width:46px;height:46px;border-radius:50%;display:block}
.seatc canvas{width:100%;height:100%;display:block}
.seatc .pips{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);gap:2px;padding:1.5px 3px;border-radius:6px;background:rgba(8,28,25,.82)}
.seatc .pips i{width:6px;height:6px}
.seat.me .seatc{filter:drop-shadow(0 0 5px rgba(255,226,150,.85))}
.chip{font-size:12px;font-weight:700;line-height:1.15;color:#d3e6dc;white-space:nowrap}
.sit,.you{height:24px;width:100%;max-width:58px;border-radius:12px;font-size:12.5px;font-weight:600;line-height:24px;text-align:center;white-space:nowrap}
.sit{background:rgba(8,28,25,.45);box-shadow:inset 0 0 0 1px rgba(111,183,162,.6);color:#d3e6dc}
.sit:active{background:rgba(111,183,162,.3)}
.you{background:var(--parch);color:var(--pine);font-weight:700}
.acts{display:flex;gap:7px}
.acts .ghost{flex:0 1 auto;padding:0 12px;font-size:15.5px;white-space:nowrap}
.acts .go{flex:1 1 auto;padding:0 10px;font-size:21px;height:46px;white-space:nowrap}

/* Sheets */
.over{position:absolute;inset:0;background:rgba(8,28,25,.8);display:flex;align-items:center;justify-content:center;padding:8px 44px}
.sheet{width:100%;max-width:660px;max-height:100%;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.shead{display:flex;align-items:center;gap:8px;min-height:44px}
.shead h3{flex:1;font-family:var(--disp);font-size:25px;line-height:1}
.shead small{font-family:"Barlow Semi Condensed",sans-serif;font-size:15px;color:var(--patina);margin-left:7px}
.shead .go{height:44px;font-size:20px;padding:0 22px}
.shead .ghost{min-height:44px}
.sbody{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px}
.spick{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-content:start}
.schamp{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.1;background:rgba(8,28,25,.3)}
.schamp canvas{width:50px;height:50px;display:block}
.schamp[aria-pressed=true],.srole button[aria-pressed=true]{background:rgba(224,181,82,.2);box-shadow:inset 0 0 0 1.5px var(--brass)}
.srole{display:grid;gap:4px;align-content:start}
.srole button{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-height:44px;padding:3px 11px;border-radius:12px;text-align:left;background:rgba(8,28,25,.3)}
.srole b{font-size:16px;font-weight:700;display:block;line-height:1.05}
.srole small{font-size:13px;color:#b8d4c8;display:block;line-height:1.05}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;font-size:18px}

/* Match overlays */
#forge{position:absolute;left:160px;top:66px;width:min(348px,calc(100% - 363px));padding:7px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
#forge button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 8px;min-height:72px;border-radius:10px;text-align:left;line-height:1.05;background:rgba(241,232,208,.08);box-shadow:inset 0 0 0 1px rgba(224,181,82,.28)}
#forge button:active{background:rgba(224,181,82,.24)}
#forge button:disabled{opacity:.46}
#forge b{font-family:var(--disp);font-weight:400;font-size:19px}
#forge small{font-size:12.5px;color:#b8d4c8}
#forge .c{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:700;color:var(--brass);margin-top:auto}
.gc{display:block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0bd,#e0b552 58%,#a87a20);box-shadow:0 0 0 .75px rgba(70,44,6,.85)}
.pgrid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;width:100%;max-width:760px;padding:14px 16px;max-height:100%;align-items:center}
.pcol{display:flex;flex-direction:column;gap:7px}
.pcol h2{font-family:var(--disp);font-size:36px;line-height:1}
.pcol .go{height:46px;font-size:22px}
.tog{display:flex;align-items:center;justify-content:space-between;min-height:42px;padding:0 13px;border-radius:21px;font-size:16px;font-weight:600;background:rgba(8,28,25,.42);box-shadow:inset 0 0 0 1px rgba(111,183,162,.5)}
.tog::after{content:"Off";color:#9db7ac}
.tog[aria-pressed=true]::after{content:"On";color:var(--brass);font-weight:700}
.board{min-height:0;max-height:100%}
.score{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1}
.score small{font-size:.82em;color:#9fc0b3;margin-left:5px;font-weight:500}
.score th{font-size:13px;font-weight:600;color:var(--patina);text-align:left;padding:0 6px 3px}
.score td{padding:1px 6px;height:27px;white-space:nowrap}
.score canvas{width:24px;height:24px;display:block}
.score .n{text-align:right;font-variant-numeric:tabular-nums}
.score tbody.t0 td:first-child{box-shadow:inset 3px 0 var(--azure)}
.score tbody.t1 td:first-child{box-shadow:inset 3px 0 var(--cinnabar)}
.score tbody+tbody tr:first-child td{border-top:1px solid rgba(224,181,82,.35)}
.score tr.me td{background:rgba(224,181,82,.16);font-weight:700}
#end{animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0}}
.egrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;width:100%;max-width:800px;padding:12px 16px;max-height:100%;align-items:center}
.ecol{display:flex;flex-direction:column;gap:8px;min-width:0}
.ehead{display:flex;align-items:center;gap:14px}
#endcoin{width:112px;height:112px;flex:none;display:block}
.ehead h2{font-family:var(--disp);font-size:44px;line-height:1}
#endW{font-size:19px;font-weight:600;color:var(--parch);line-height:1.1}
#endS{font-size:15.5px;line-height:1.15;color:#d9e7dc}
.prof{height:10px;border-radius:5px;background:rgba(4,16,14,.55);box-shadow:inset 0 0 0 1px rgba(224,181,82,.45);overflow:hidden;position:relative}
.prof b{display:block;height:100%;background:linear-gradient(90deg,#b98527,#f8df95)}
#endM{font-size:16px;font-weight:600;color:var(--brass);line-height:1.15}
.row{display:flex;gap:8px}
.row .go{height:46px;font-size:21px;padding:0 20px}

/* Short and narrow phones. Set from JS because the stage may be rotated. */
.sm #lobby{padding:6px 44px;grid-template-rows:38px minmax(0,1fr) auto;column-gap:10px}
.sm .ltop h1{font-size:25px}
.sm .ltop{gap:8px}
.sm .mission{font-size:14px}
.sm .mission b{font-size:17px;margin-right:5px}
.sm .seg{font-size:14px}
.sm .seg button{min-width:38px;padding:0 6px}
.sm .tok{padding:0 10px;font-size:14px}
.sm #endW{font-size:15px}
.sm .rung{width:21px;height:21px;padding:2px}
.sm .ladder{gap:2px}
.sm .lad{font-size:12.5px}
.sm .nm h2{font-size:24px}
.sm .tags span{font-size:12px;padding:0 6px}
.sm .blurb{display:none}
.sm .abil>div{grid-template-columns:28px minmax(0,1fr) auto;font-size:12px;gap:5px;line-height:1.05}
.sm .abil img{width:28px;height:28px}
.sm .abil u{font-size:11.5px}
.sm .stats,.sm .arng{font-size:11.5px}
.sm .pick{width:50px;padding:1px 0}
.sm .pick canvas{width:40px;height:40px}
.sm .seatc{width:38px;height:38px}
.sm .chip{font-size:11px}
.sm .sit,.sm .you{font-size:11.5px;height:23px;line-height:23px}
.sm .team h3{font-size:13.5px;margin-bottom:1px}
.sm .side{gap:5px}
.sm .acts .go{font-size:19px;height:42px}
.sm .acts .ghost{min-height:42px;font-size:14px;padding:0 9px}
.sm .tword b{font-size:66px}
.sm .tword em{font-size:18px}
.sm .schamp canvas{width:40px;height:40px}
.sm .srole button{min-height:38px}
.sm .srole small{font-size:12px}
.sm .sheet{padding:8px 12px;gap:4px}
.sm #endcoin{width:84px;height:84px}
.sm .ehead h2{font-size:34px}
.sm #endS{font-size:13.5px}
.sm .score{font-size:13px}
.sm .score td{height:24px;padding:0 4px}
.sm .score canvas{width:20px;height:20px}
.sm .pcol h2{font-size:28px}
.sm .pgrid{grid-template-columns:150px minmax(0,1fr);gap:10px;padding:8px 12px}
.sm .tog{min-height:36px}
#wipe{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:50}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="forge" class="plate hide" role="group" aria-label="Upgrades"></div>

  <div id="pause" class="over hide" role="dialog" aria-label="Paused">
    <div class="plate pgrid">
      <div class="pcol">
        <h2>Paused</h2>
        <button class="go" id="resume">Resume</button>
        <button class="ghost" id="leave">Leave match</button>
        <button class="tog" id="pMusic">Music</button>
        <button class="tog" id="pSfx">Effects</button>
      </div>
      <div class="board scroll" id="pBoard"></div>
    </div>
  </div>

  <div id="end" class="over hide" role="dialog" aria-label="Match result">
    <div class="plate egrid">
      <div class="ecol">
        <div class="ehead"><canvas id="endcoin" width="300" height="300"></canvas><div><h2 id="endT"></h2><p id="endW"></p></div></div>
        <p id="endS"></p>
        <div class="prof"><b id="endBar"></b></div>
        <p id="endM"></p>
        <div class="row"><button class="go" id="again">Play again</button><button class="ghost" id="tolobby">Change champion</button></div>
      </div>
      <div class="board scroll" id="eBoard"></div>
    </div>
  </div>

  <div id="lobby" class="hide">
    <div class="ltop">
      <h1>Mintfall</h1>
      <p class="mission" id="mission"></p>
      <div>
        <div class="seg" id="diff"><span>Bots</span><button data-d="easy">Easy</button><button data-d="normal">Normal</button><button data-d="hard">Hard</button></div>
        <button class="tok" id="openSet">Settings</button>
      </div>
    </div>
    <div class="hero"><canvas id="big" width="520" height="520"></canvas><div class="ladder" id="ladder"></div><p class="lad" id="wTier"></p></div>
    <div class="who">
      <div class="nm"><h2 id="wN"></h2><div class="tags" id="wT"></div></div>
      <p class="blurb" id="wB"></p>
      <div class="abil" id="wA"></div>
      <div class="stats" id="wS"></div>
      <p class="arng" id="wR"></p>
    </div>
    <div class="picks" id="picks"></div>
    <div class="side">
      <div class="team t0"><h3>Heroes</h3><div class="seats" id="s0"></div></div>
      <div class="team t1"><h3>Villains</h3><div class="seats" id="s1"></div></div>
      <div class="acts"><button class="ghost" id="auto">Auto-fill roles</button><button class="go" id="start">Start match</button></div>
    </div>
  </div>

  <div id="call" class="hide" aria-live="polite"><div class="plate"><h2 id="callT"></h2><p id="callM"></p></div></div>

  <div id="sheet" class="over hide" role="dialog" aria-label="Seat setup">
    <div class="plate sheet scroll">
      <div class="shead"><h3 id="shT"></h3><button class="ghost" id="shSit">Sit here</button><button class="go" id="shDone">Done</button></div>
      <div class="sbody"><div class="spick" id="shC"></div><div class="srole" id="shR"></div></div>
    </div>
  </div>

    normal: { react: .32, err: .13, dodge: .45, aggr: 1, gap: .5, lead: .85, think: .16, lh: .8, lhErr: .08, judge: .15, iq: .7, low: .3, see: 1000 },

  // ---------- helpers ----------
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  const norm = (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l, l }; };

  const segDist = (px, py, ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
    const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);

  // ---------- map ----------
  function buildMap() {
    const quad = [[690, 480, 340, 64], [1170, 480, 250, 64], [1040, 700, 64, 170], [1260, 690, 190, 64], [560, 640, 80, 200]];
    const corner = [[0, 0, 330, 330]];

      const [x, y, w, h] = r;
      for (const [mx, my] of [[0, 0], [1, 0], [0, 1], [1, 1]])
        walls.push({ x: mx ? W - x - w : x, y: my ? H - y - h : y, w, h, big: solid });
    };
    quad.forEach(r => add(r, false)); corner.forEach(r => add(r, true));
    const brush = [];
    for (const [x, y, r] of [[1000, 405, 95], [1470, 610, 105], [850, 620, 90]])
      for (const [mx, my] of [[0, 0], [1, 0], [0, 1], [1, 1]])
        brush.push({ x: mx ? W - x : x, y: my ? H - y : y, r });
    const top = [[250, 950], [430, 520], [800, 300], [1600, 240], [2400, 300], [2770, 520], [2950, 950]];
    const lanes = [top, top.map(([x, y]) => [x, H - y])];
    const cols = Math.ceil(W / 40), rows = Math.ceil(H / 40);
    const grid = new Uint8Array(cols * rows);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const px = i * 40 + 20, py = j * 40 + 20;

  const nearChamp = (s, c, x, y, maxD) => { let b = null, bd = maxD; for (const e of s.champs) { if (!e.alive || e.air || e.team === c.team || !canSee(s, c.team, e)) continue; const d = Math.hypot(e.x - x, e.y - y); if (d < bd) { b = e; bd = d; } } return b; };

  }

  function assess(s, c, b) {

  function findLastHit(s, c, b) {

  }

  // ---------- bots: jobs ----------
  function fightMove(s, c, b, t, d) {
    const k = KITS[c.champ];

    else noMove(b);
  }

  function laneTask(s, c, b, lane, ai, pushing) {
    const k = KITS[c.champ], info = s.laneInfo[c.team][lane], front = info.front, foeFront = s.laneInfo[1 - c.team][lane].front, own = firstTower(s, c.team, lane);
    const home = s.fountains[c.team], wob = Math.sin(c.slot * 2.1);
    let x, y;
    if (front) {
      const p = front.path, wp = Math.min(front.wp, p.length - 1), prev = p[Math.max(0, wp - 1)], n = norm(prev[0] - front.x, prev[1] - front.y);
      const back = k.melee ? 60 : clamp(c.range * .5, 60, 240);

    if (carry && dist(carry, c) < 1500) { const n = norm(home.x - carry.x, home.y - carry.y); x = carry.x + n.x * 130 - n.y * 60; y = carry.y + n.y * 130 + n.x * 60; }

  function pickGank(s, c, b) {

    }

      const group = ai.push !== null || ai.hoard;

        || (b.fighting && b.ratio > .78 && d < 900) || (group && b.ratio > .95 && d < 850);

    for (const t of s.towers) if (t.alive) stepTower(s, t);
    stepProj(s); stepZones(s); stepSites(s);
    s.minions = s.minions.filter(m => m.alive); s.monsters = s.monsters.filter(m => m.alive);
  }

  function masteryGain(st, won) {
    const acc = st.casts ? Math.min(1, st.skillHits / st.casts) : 0;
    return Math.round(st.skillHits * 6 * (.6 + acc) + st.parries * 25 + (st.kills + st.assists * .5) * 20 + (won ? 60 : 20));
  }
  function tierOf(p) { let t = 0; TIERS.forEach((x, i) => { if (p >= x.at) t = i; }); return t; }

  return { W, H, TICK, DT, KITS, buildMap, TIERS, TEAM_NAMES, FORGE_COST, createMatch, step, canSee, autoTarget, masteryGain, tierOf, towerOpen, xpNeed, ROLES, ROLE_INFO, autoRoles, CHARS, charOf };
})();
if (typeof module !== 'undefined') module.exports = Sim;
</script>

  const TEAM = ['#58a6e6', '#e4573f'], TEAM_DARK = ['#1f4f7d', '#7e2a1e'];
  const METAL = {
    vesper: ['#cfcbe8', '#6a6498'], kade: ['#efcd77', '#9a6a2a'], ione: ['#a9e6dd', '#3b8a8a'],
    solenne: ['#f9e4ae', '#cc8d4c'], sable: ['#9ea3b2', '#3f4250'], gravel: ['#d3a583', '#6e4a38'],

// Touch controls. Abilities fire on release so the player always has a chance to cancel.
const { Ctl, applyInput, aimDir } = (() => {
  const Ctl = {
    p: new Map(), stick: null, aim: null, atk: null,
    reset() { this.p.clear(); this.stick = null; this.aim = null; this.atk = null; },
    pt(e) { return rotated ? { x: e.clientY, y: innerWidth - e.clientX } : { x: e.clientX, y: e.clientY }; },
  };
  const near = (b, p, pad) => Math.hypot(p.x - b.x, p.y - b.y) < b.r + pad;
  const STICK = 58, MOVE_PX = 16, FULL_PX = 96;

  // Nearest visible enemy champion in range, otherwise the nearest unit.
  function quickTarget(me, a) {
    const r = (a.range || 600) + 80; let best = null, bd = r;
    for (const e of G.s.champs) {
      if (!e.alive || e.team === me.team || !Sim.canSee(G.s, me.team, e)) continue;

    scan(G.s.minions); scan(G.s.monsters);

  }

  // Where the current aim points. tx, ty is the exact point a release would send.
  function aimDir() {
    const me = G.me, A = Ctl.aim;
    if (!A) return { dx: me.fx, dy: me.fy, target: null, tx: me.x, ty: me.y, k: 1, reach: 0 };
    const a = me.kit[A.slot], range = a.range || 0, circle = a.shape === 'circle';
    let dx = me.fx, dy = me.fy, target = null, k = 1;
    if (a.shape === 'self') return { dx, dy, target, tx: me.x, ty: me.y, k, reach: 0 };
    if (A.moved) {

      dx = A.dx / l; dy = wy / l;

    Ctl.aim = null;

  }

  function pressAbility(i, id, p) {
    const me = G.me, a = me.kit[i];

    if (i === 2 && me.lvl < 3) { Hud.toast('Ultimate unlocks at level 3'); Hud.deny(i); Sound.play('cancel'); return; }

      if (Ctl.aim && near(U.cancel, p, 6)) { cancelAim(); return; }
      if (near(U.pause, p, 10)) { Hud.openPause(); return; }
      if (near(U.forge, p, 8)) { Hud.toggleForge(); return; }
      if (near(U.recall, p, 8)) { if (me.alive) { me.q.push({ t: 'recall' }); Sound.play('recall'); } return; }
      if (near(U.atk, p, 14)) { Ctl.p.set(e.pointerId, { role: 'atk' }); Ctl.atk = e.pointerId; Sound.play('tap'); return; }
      for (let i = 0; i < 3; i++) if (near(U.ab[i], p, 9)) { pressAbility(i, e.pointerId, p); return; }
    }
    if (p.x < VW * .55 && !Ctl.stick) { Ctl.stick = { id: e.pointerId, sx: p.x, sy: p.y, x: p.x, y: p.y }; Ctl.p.set(e.pointerId, { role: 'stick' }); }
  });

  view.addEventListener('pointermove', e => {
    if (!G) return; e.preventDefault();
    const st = Ctl.stick, A = Ctl.aim;
    if (st && st.id === e.pointerId) { const p = Ctl.pt(e); st.x = p.x; st.y = p.y; }

      const p = Ctl.pt(e), U = Hud.ui, B = U.ab[A.slot];

  });

  function endPointer(e, lost) {
    Sound.init();

  view.addEventListener('pointercancel', e => endPointer(e, true));

  function applyInput() {
    const me = G.me, st = Ctl.stick;

    if (Ctl.aim && !me.alive) Ctl.aim = null;
    if (Ctl.aim && me.charge && me.charge.slot === Ctl.aim.slot) {
      const d = aimDir(), far = me.kit[Ctl.aim.slot].range || 600;

    }
  }

  return { Ctl, applyInput, aimDir };
})();

  // ---------- minimap ----------
  function bakeMap(s) {

    g.fillStyle = '#17463d'; g.fillRect(0, 0, c.width, c.height);

  function drawAbility(i, dt, me) {

    g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(VW / 2, VH / 2, hole, 0, TAU); g.fill();

    g.strokeStyle = '#fff0bd'; g.lineWidth = 7 * (1 - p) + 1; g.beginPath(); g.arc(VW / 2, VH / 2, hole, 0, TAU); g.stroke();
  }

  // ---------- title ----------
  const T = { a: .4, dust: null, sweep: 0 };
  function titleStep(dt) {
    if (hidden('title')) return;
    const c = $('tcan'), k = Math.min(devicePixelRatio || 1, 2), w = Math.round(VW * k), h = Math.round(VH * k);
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    const g = c.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, VW, VH);
    const cx = VW * .3, cy = VH * .5, R = Math.min(VH * .42, VW * .22), spr = Art.coin('title', 230, 'boss', Art.METAL.boss, -1, 3);
    if (!T.dust) T.dust = Array.from({ length: 56 }, () => ({ x: Math.random(), y: Math.random(), v: .02 + Math.random() * .05, p: Math.random() * 7, s: 1.5 + Math.random() * 3.4 }));
    if (!calm) { T.a += dt * 1.15; T.sweep = (T.sweep + dt / 3.2) % 1; }
    const ang = calm ? 0 : eased(T.a);
    spinCoin(g, spr, cx, cy, R, ang);
    sweepCoin(g, cx, cy, R, ang, T.sweep * 3.2 < 1 ? T.sweep * 3.2 : -1);
    const gl = Art.glow('#ffe08a');
    g.globalCompositeOperation = 'lighter';
    for (const d of T.dust) {
      if (!calm) { d.y -= d.v * dt; if (d.y < -.05) { d.y = 1.05; d.x = Math.random(); } d.p += dt * 2.2; }
      const r = d.s * (1.4 + Math.sin(d.p)), X = d.x * VW + Math.sin(d.p * .6) * 12, Y = d.y * VH;
      g.globalAlpha = .28 + (Math.sin(d.p * 1.7) + 1) * .24;
      g.drawImage(gl, X - r, Y - r, 2 * r, 2 * r);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  // ---------- lobby hero ----------
  let flipT = 0, heroA = .3, heroSweep = 0;
  function heroStep(dt) {
    if (hidden('lobby') || !L.seats) return;
    const c = $('big'), g = c.getContext('2d'), id = mine().champ, spr = Art.champCoin(id, L.team, Sim.tierOf(pts(id)), 230);
    if (!calm) { heroA += dt * .85; heroSweep = (heroSweep + dt / 4) % 1; }
    if (flipT > 0) flipT = Math.max(0, flipT - dt * 2.4);
    const ang = calm ? 0 : eased(heroA) + flipT * TAU;
    g.clearRect(0, 0, 520, 520);
    spinCoin(g, spr, 260, 258, 232, ang);
    sweepCoin(g, 260, 258, 232, ang, heroSweep * 4 < 1 ? heroSweep * 4 : -1);
  }

  // ---------- end screen ----------
  let E = null;
  function showEnd(r) {
    const st = r.me.stats, tier = Sim.tierOf(r.before);
    hide('forge'); Ctl.reset();
    $('endT').textContent = r.won ? 'Victory' : 'Defeat';
    $('endT').style.color = r.won ? '#ffe08a' : '#f59a86';
    $('endW').textContent = r.s.over.winner === 0 ? 'City saved' : 'City fallen';
    $('endS').textContent = `${st.kills} takedowns, ${st.deaths} deaths, ${st.assists} assists. You landed ${st.skillHits} of ${st.casts} abilities${st.parries ? ` and parried ${st.parries} hits` : ''}.`;
    Hud.scoreTable($('eBoard'), r.s, r.me);
    E = { t: 0, r, name: charName(r.me.team, r.me.champ), tier, draw: tier, flip: 0, shine: -1, p: r.before, ang: 0 };
    endText(); $('endBar').style.width = endFrac(r.before) * 100 + '%';
    show('end');
  }
  function endFrac(p) { const t = Sim.tierOf(p), n = TIERS[t + 1]; return n ? (p - TIERS[t].at) / (n.at - TIERS[t].at) : 1; }
  function endText() {
    const r = E.r, t = Sim.tierOf(E.p), n = TIERS[t + 1], risen = t > Sim.tierOf(r.before);
    const lead = risen ? `Your ${E.name} coin is now ${TIERS[t].name}. ` : '';
    $('endM').textContent = `${lead}+${r.gain} proficiency${n ? `, ${Math.ceil(n.at - E.p)} to ${n.name}` : ''}`;
  }
  function endStep(dt) {
    if (!E || hidden('end')) return;
    const r = E.r; E.t += dt;
    const f = calm ? 1 : Math.min(1, Math.max(0, (E.t - .5) / 1.5)), ease = 1 - Math.pow(1 - f, 3), p = r.before + r.gain * ease;
    if (p !== E.p) {
      E.p = p; $('endBar').style.width = endFrac(p) * 100 + '%'; endText();
      const t = Sim.tierOf(p);
      if (t > E.tier) { E.tier = t; E.flip = 1; E.shine = -1; Sound.play('level'); }
    }
    if (E.flip > 0) { E.flip = Math.max(0, E.flip - dt * 1.05); if (E.flip <= 0) E.shine = 0; }
    if (E.flip < .75) E.draw = E.tier;
    E.ang = calm ? 0 : E.flip * TAU * 2 + Math.sin(E.t * .7) * .3;
    const id = r.me.champ, spr = Art.champCoin(id, r.me.team, E.draw, 130), g = $('endcoin').getContext('2d');
    g.clearRect(0, 0, 300, 300);
    spinCoin(g, spr, 150, 148, 130, E.ang);
    if (E.shine >= 0 && E.shine < 1) { E.shine += dt * 1.3; sweepCoin(g, 150, 148, 130, E.ang, Math.min(.99, E.shine)); }
  }
  // A new lobby rolls a side and says so once the wipe has cleared.
  function enterLobby() {
    rollSide(); renderLobby(); show('lobby');
    $('callT').textContent = L.team ? 'You are a villain' : 'You are a hero';
    $('callM').textContent = MISSION[L.team];
    callT = -1;
  }
  function backToLobby() {
    return wipe(() => { paused = false; G = null; Ctl.reset(); hide('end'); hide('pause'); hide('forge'); enterLobby(); Sound.setMode('menu'); });
  }
  function begin(reroll) {
    return wipe(() => { if (reroll) rollSide(); hide('lobby'); hide('end'); hide('title'); paused = false; startMatch(buildCfg()); Sound.setMode('match'); });
  }
  let callT = 0;
  function callStep(dt) {
    if (callT === -1) { if (W.on) return; callT = 2.2; show('call'); Sound.play('level'); return; }
    if (callT > 0) { callT -= dt; if (callT <= 0 || hidden('lobby')) { callT = 0; hide('call'); } }
  }

  // ---------- wiring ----------
  function initMenus() {
    rollSeats(); renderLobby(); syncToggles();
    Hud.syncToggles = syncToggles;
    $('title').onclick = () => {
      Sound.init(); Sound.play('title'); Sound.setMode('menu');
      wipe(() => { hide('title'); enterLobby(); });
    };
    document.querySelectorAll('#diff [data-d]').forEach(b => { b.onclick = () => { save.diff = b.dataset.d; persist(); Sound.play('tap'); renderLobby(); }; });
    $('openSet').onclick = () => { Sound.play('tap'); syncToggles(); show('settings'); };
    $('setDone').onclick = () => { Sound.play('tap'); hide('settings'); };
    $('sMusic').onclick = $('pMusic').onclick = () => toggle('music');
    $('sSfx').onclick = $('pSfx').onclick = () => toggle('sfx');
    document.querySelectorAll('#gfx [data-g]').forEach(b => { b.onclick = () => { save.gfx = b.dataset.g; persist(); if (save.gfx === 'auto') quality = 2; applyQuality(); Sound.play('tap'); syncToggles(); }; });
    $('auto').onclick = () => { autoFill(); Sound.play('coin'); renderLobby(); };
    $('start').onclick = () => { Sound.play('tap'); hide('call'); callT = 0; begin(false); };
    $('shDone').onclick = () => { Sound.play('tap'); hide('sheet'); L.sheet = null; };
    $('shSit').onclick = () => { if (!L.sheet) return; moveMe(L.sheet.i); hide('sheet'); L.sheet = null; renderLobby(); };
    $('resume').onclick = () => { paused = false; hide('pause'); Sound.play('tap'); };
    $('leave').onclick = () => { Sound.play('tap'); backToLobby(); };
    $('again').onclick = () => { Sound.play('tap'); begin(true); };
    $('tolobby').onclick = () => { Sound.play('tap'); backToLobby(); };
  }

  function animMenus(dt) { wipeStep(dt); callStep(dt); titleStep(dt); heroStep(dt); endStep(dt); }

  return { initMenus, animMenus, showEnd };
})();

// Connects the simulation to Sound: spatialised event effects and per-frame music, weather and heartbeat control.
const SND = { level: 0, dmg: 0, send: 0, slow: 0, heart: 0, bolt: 0, coin: 0, coinT: 0, over: false, quiet: false, t: 0 };
const SND_LADDER = [1, 1.125, 1.25, 1.5, 1.667, 2];

function initSound(g) {
  Object.assign(SND, { level: 0, dmg: 0, send: 0, slow: 0, heart: 0, bolt: 0, coin: 0, coinT: 0, over: false, quiet: false, t: 0 });
  if (g && g.me) Sound.setSide(g.me.team === 0 ? 'hero' : 'villain');
  Sound.intensity(0); Sound.late(0); Sound.hope(.5);
  Sound.setMode('match');
}

// Volume and pan for a world position, or null when it is too far away to hear.
function soundAt(x, y, floor = 0) {
  if (!G || !G.cam) return null;
  const dx = x - G.cam.x, dy = y - G.cam.y, d = Math.hypot(dx / 510, dy / 350);
  if (d > 1.9 && !floor) return null;
  const v = d < 1 ? 1 - d * .2 : Math.max(0, .8 * (1.9 - d) / .9);
  return { vol: Math.max(v, floor), pan: Math.max(-.85, Math.min(.85, dx / 640)) };
}
function soundUnit(id) { const s = G.s; return s.champs.find(c => c.id === id) || s.minions.find(c => c.id === id) || s.monsters.find(c => c.id === id) || s.towers.find(c => c.id === id); }

const SND_CAST = { snipe: 'snipe', snipeFull: 'snipeFull', deadeye: 'deadeye', orb: 'orb', ray: 'ray', chain: 'chain', bolt: 'bolt', mbolt: 'mbolt', tower: 'tshot', dash: 'dash', parry: 'parry', slash: 'slash', dome: 'dome', crash: 'whoosh', heal: 'heal', rupture: 'orb', stomp: 'stomp', break: 'break' };
const SND_BOOM = { crash: 'crash', stomp: 'stomp', rupture: 'rupture', heal: 'heal', break: 'break', dome: 'dome', deadeye: 'blast', snipeFull: 'blast' };

function soundEvent(e) {
  if (!G || !G.s || !G.me) return;
  const me = G.me, at = (u, floor) => u ? soundAt(u.x, u.y, floor) : null;
  switch (e.e) {
    case 'cast': {
      const u = soundUnit(e.u), name = SND_CAST[e.fx]; if (!u || !name) return;
      if (u === me) { Sound.play(name, undefined, 30); return; }
      const o = at(u); if (o) Sound.play(name, undefined, 50, o);
      return;
    }
    case 'boom': { const name = SND_BOOM[e.fx] || 'blast', o = soundAt(e.x, e.y); if (o) Sound.play(name, undefined, 60, o); return; }
    case 'phit': { if (e.fx === 'dome') { const o = soundAt(e.x, e.y); if (o) Sound.play('clink', 1.3, 50, o); } return; }
    case 'blink': { const o = soundAt(e.x, e.y); if (o) Sound.play('blink', undefined, 60, o); return; }
    case 'hit': {
      const u = soundUnit(e.u), by = e.by ? soundUnit(e.by) : null, o = at(u); if (!u) return;
      const mine = u === me || by === me;
      if (u === me) SND.dmg = Math.min(1, SND.dmg + e.a / Math.max(1, me.maxHp) * 2.4);
      if (!o) return;
      if (mine) {
        const name = u === me ? 'thud' : e.crit ? 'crit' : e.sk ? 'hitHard' : 'hit';
        Sound.play(name, undefined, u === me ? 90 : 45, u === me ? undefined : o);
      } else if (e.sk) Sound.play('hitHard', undefined, 70, Object.assign(o, { vol: o.vol * .7 }));
      else if (u.kind === 'champ' || (by && by.kind === 'champ')) Sound.play('hit', undefined, 70, Object.assign(o, { vol: o.vol * .6, low: true }));
      else Sound.play('tick', undefined, 80, Object.assign(o, { vol: o.vol * .55, low: true }));
      return;
    }
    case 'die': {
      if (e.kind === 'champ') {
        if (e.u === me.id) Sound.play('death');
        const o = soundAt(e.x, e.y, e.by === me.id ? .9 : .35); if (o) Sound.play('kill', undefined, 120, o);
      } else if (e.kind === 'tower') { const o = soundAt(e.x, e.y, .5); if (o) Sound.play('tower', undefined, 200, o); }
      return;
    }
    case 'gold': {
      if (e.u !== me.id) return;
      SND.coin = G.t - SND.coinT < 1.4 ? Math.min(SND_LADDER.length - 1, SND.coin + 1) : 0; SND.coinT = G.t;
      Sound.play('coin', SND_LADDER[SND.coin], 40); return;
    }
    case 'parry': { const u = soundUnit(e.u); if (u === me) Sound.play('parry', undefined, 60); else { const o = at(u); if (o) Sound.play('parry', undefined, 60, o); } return; }
    case 'level': { if (e.u === me.id) Sound.play('level', undefined, 200); return; }
    case 'boss': Sound.play('boss', undefined, 400); return;
    case 'bossup': Sound.play('bossup', undefined, 400); return;
    case 'tower': Sound.play('towerNews', e.team !== me.team, 300, { vol: .75 }); return;
    case 'forge': { if (e.u === me.id) Sound.play('forge', undefined, 120); return; }
    case 'spawn': { if (e.u === me.id) Sound.play('respawn', undefined, 200); return; }
    case 'cancelled': { if (e.u === me.id) Sound.play('cancel', undefined, 80); return; }
    case 'feed': Sound.play('feed', e.multi || 1, 180, { vol: e.first ? 1 : .7 }); return;
    case 'tshot': { const u = soundUnit(e.u), o = at(u); if (o) Sound.play('tshot', undefined, 90, o); return; }
    case 'atk': {
      const u = soundUnit(e.u); if (!u || u.kind !== 'champ') return;
      const melee = Sim.KITS[u.champ] && Sim.KITS[u.champ].melee, name = melee ? 'swing' : 'bolt';
      if (u === me) Sound.play(name, undefined, 40); else { const o = at(u); if (o) Sound.play(name, undefined, 90, Object.assign(o, { vol: o.vol * .6, low: true })); }
      return;
    }
    case 'heal': { if (e.u === me.id && e.a >= 40) Sound.play('mark', undefined, 350, { vol: .7 }); return; }
    case 'stun': { const u = soundUnit(e.u), o = at(u); if (o) Sound.play('stun', undefined, 150, o); return; }
    case 'mark': { const u = soundUnit(e.u), o = at(u); if (o) Sound.play('mark', undefined, 120, o); return; }
    case 'civ': { const o = soundAt(e.x, e.y, .5); if (o) Sound.play(e.team === 0 ? 'rescued' : 'seized', undefined, 300, o); return; }
    case 'hope': { if (e.on) Sound.play(e.team === 0 ? 'hopeSwell' : 'dread', undefined, 1200); return; }
  }
}

function soundFrame(dt) {
  if (!G || !G.s || !G.me) return;
  const s = G.s, me = G.me;
  if (G.ended || s.over) {
    if (s.over && !SND.over) { SND.over = true; Sound.stinger(s.over.winner === me.team); }
    if (!SND.quiet) { SND.quiet = true; Sound.intensity(0); Sound.ambience(0, .1); }
    return;
  }
  if (dt <= 0) return;

  let near = 0;
  for (const c of s.champs) {
    if (c.team === me.team || !c.alive || (Sim.canSee && !Sim.canSee(s, me.team, c))) continue;
    const d = Math.hypot(c.x - me.x, c.y - me.y); if (d < 900) near += 1 - d / 900;
  }
  const hp = me.alive ? me.hp / Math.max(1, me.maxHp) : 1;
  SND.dmg = Math.max(0, SND.dmg - dt * .32);
  const target = me.alive ? Math.min(1, .12 + Math.min(1, near / 1.5) * .6 + SND.dmg * .45 + Math.max(0, .5 - hp) * .6) : .15;
  SND.level += (target - SND.level) * Math.min(1, dt / (target > SND.level ? .6 : 3));

  if (me.alive && hp < .25) {
    SND.heart -= dt;
    if (SND.heart <= 0) { Sound.play('heart', undefined, 0); SND.heart = .6 + .35 * hp / .25; }
  } else SND.heart = 0;

  const b = G.bolt || 0;
  if (b > .9 && SND.bolt <= .9) Sound.play('thunder', undefined, 700);
  SND.bolt = b;

  SND.send -= dt;
  if (SND.send <= 0) {
    SND.send = .2; SND.t += .2;
    Sound.intensity(SND.level);
    Sound.late(Math.max(0, Math.min(1, (s.t - 480) / 360)));
    if (typeof s.hope === 'number') Sound.hope(s.hope / 100);
    const rain = typeof G.rain === 'number' ? G.rain : 0;
    Sound.ambience(rain, Math.min(1, .22 + Math.sin(SND.t * .13) * .1 + rain * .45));
    const p = (s.t / 780 + .12) % 1;
    Sound.night(typeof G.night === 'number' ? G.night : Math.max(0, 1 - Math.abs(p - .86) / .16));
    Sound.lean(typeof quality === 'number' && quality === 0);
  }
}

layout(); initMenus(); requestAnimationFrame(frame);
window.__mintfall = { get G() { return G; } };

})();</script>
