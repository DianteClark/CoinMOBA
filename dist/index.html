<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mintfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pine:#10302b;--verdigris:#2c6f62;--patina:#6fb7a2;--brass:#e0b552;--copper:#b9744a;--parch:#f1e8d0;--azure:#58a6e6;--cinnabar:#e4573f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--pine);overflow:hidden;overscroll-behavior:none;touch-action:none;color:var(--parch);font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-weight:500}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--pine)}
canvas#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3,p{margin:0;font-weight:inherit}
.hide{display:none!important}

#lobby{position:absolute;inset:0;display:grid;grid-template-columns:minmax(150px,30%) 1fr minmax(210px,31%);gap:0 14px;padding:12px 44px 12px;background:radial-gradient(120% 130% at 18% 45%,#3b8a78 0,#225a50 34%,#123a33 72%,#0c2a26 100%)}
#lobby::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 16% 48%,rgba(255,255,255,.028) 0 2px,transparent 2px 15px);pointer-events:none}
.mark{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;position:relative;height:38px}
.mark h1{font-family:Forum,Georgia,serif;font-size:32px;letter-spacing:.015em;color:var(--parch)}
.seg{display:flex;align-items:center;gap:4px;font-size:15px}
.seg span{color:var(--patina);margin-right:4px}
.seg button{padding:5px 11px;border-radius:13px;color:#bcd8cc;min-height:30px}
.seg button[aria-pressed=true]{background:var(--parch);color:var(--pine);font-weight:700}
.bigcoin{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.bigcoin canvas{width:min(100%,250px);max-height:100%;aspect-ratio:1;display:block}
.who{position:relative;display:flex;flex-direction:column;min-width:0;justify-content:center;gap:5px}
.who h2{font-family:Forum,Georgia,serif;font-size:34px;line-height:1}
.who .tag{font-size:17px;color:#cde4d9;line-height:1.15}
.tierbar{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--brass);font-weight:600}
.tierbar i{display:block;flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;max-width:150px}
.tierbar b{display:block;height:100%;background:var(--brass)}
.abil{display:grid;gap:2px;font-size:14.5px;line-height:1.14;color:#d9e7dc}
.abil em{font-style:normal;color:var(--brass);font-weight:700}
.picks{grid-column:1/3;display:flex;gap:6px;position:relative;align-items:center;justify-content:flex-start;padding-top:4px}
.picks button{width:54px;height:54px;border-radius:50%;position:relative;transition:transform .12s}
.picks button canvas{width:100%;height:100%;display:block}
.picks button[aria-pressed=true]{transform:scale(1.14);filter:drop-shadow(0 0 7px rgba(255,226,150,.85))}
.side{grid-column:3;grid-row:2/4;position:relative;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.teams{display:grid;gap:7px}
.team h3{font-size:16px;font-weight:700;margin-bottom:3px}
.team:nth-child(1) h3{color:#8cc7f2}.team:nth-child(2) h3{color:#f59a86}
.slots{display:flex;gap:5px}
.slots button{width:46px;height:46px;border-radius:50%;position:relative}
.slots button canvas{width:100%;height:100%;display:block}
.slots button[aria-current=true]::after{content:"You";position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);background:var(--parch);color:var(--pine);font-size:11px;font-weight:700;padding:0 5px;border-radius:7px;line-height:14px}
.go{height:52px;border-radius:26px;background:linear-gradient(180deg,#f4d27c,#c8912e);color:#2a1c06;font-family:Forum,Georgia,serif;font-size:24px;box-shadow:0 3px 0 #7c5513,0 8px 14px rgba(0,0,0,.3)}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #7c5513}
.note{font-size:13.5px;color:#a6c8ba;line-height:1.15}

.panel{position:absolute;background:rgba(10,36,32,.94);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(224,181,82,.45)}
#forge{left:72px;top:116px;width:300px;padding:8px;display:grid;gap:6px}
#forge button.f{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;padding:7px 11px;border-radius:9px;background:rgba(255,255,255,.07);min-height:48px;line-height:1.1}
#forge button.f:disabled{opacity:.45}
#forge b{font-size:18px;font-weight:700;color:var(--parch)}
#forge small{font-size:14px;color:#b8d4c8;display:block}
#forge .c{font-size:18px;color:var(--brass);font-weight:700}

.over{position:absolute;inset:0;background:rgba(8,28,25,.84);display:flex;align-items:center;justify-content:center;padding:14px 44px}
.card{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center;max-width:620px;width:100%}
.card h2{font-family:Forum,Georgia,serif;font-size:42px;line-height:1}
.card canvas{width:150px;height:150px;grid-row:1/5}
.card p{font-size:17px;line-height:1.2;color:#d9e7dc}
.card .row{display:flex;gap:10px;margin-top:4px}
.ghost{height:48px;padding:0 20px;border-radius:24px;font-size:18px;font-weight:600;box-shadow:inset 0 0 0 1.5px var(--patina);color:var(--parch)}
.card .go{padding:0 26px;height:48px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="forge" class="panel hide" role="dialog" aria-label="Upgrades"></div>
  <div id="pause" class="over hide"><div class="card"><div style="grid-column:1/-1"><h2>Paused</h2><div class="row" style="margin-top:14px"><button class="go" id="resume">Resume</button><button class="ghost" id="leave">Leave match</button></div></div></div></div>
  <div id="end" class="over hide"><div class="card"><canvas id="endcoin" width="300" height="300"></canvas><h2 id="endT"></h2><p id="endS"></p><p id="endM" style="color:var(--brass);font-weight:600"></p><div class="row"><button class="go" id="again">Play again</button><button class="ghost" id="tolobby">Change champion</button></div></div></div>
  <div id="lobby">
    <div class="mark"><h1>Mintfall</h1><div class="seg"><span>Bots</span><button data-d="easy">Easy</button><button data-d="normal">Normal</button><button data-d="hard">Hard</button><button id="snd" style="margin-left:8px"></button></div></div>
    <div class="bigcoin"><canvas id="big" width="520" height="520"></canvas></div>
    <div class="who"><h2 id="wN"></h2><div class="tag" id="wT"></div><div class="tierbar"><span id="wTier"></span><i><b id="wBar"></b></i></div><div class="abil" id="wA"></div></div>
    <div class="picks" id="picks"></div>
    <div class="side"><div class="teams"><div class="team"><h3>Azure</h3><div class="slots" id="s0"></div></div><div class="team"><h3>Cinnabar</h3><div class="slots" id="s1"></div></div></div><p class="note">Tap any open seat to play on that team. Bots fill the rest.</p><button class="go" id="start">Start match</button></div>
  </div>
</div>
<script>// Mintfall simulation. No DOM in this file, so it can run on a phone today
// and inside a Cloudflare Durable Object later without changes.
const Sim = (() => {
  const W = 3200, H = 1900, TICK = 30, DT = 1 / TICK;
  const TEAM_NAMES = ['Azure', 'Cinnabar'];
  const TIERS = [
    { name: 'Copper', at: 0 }, { name: 'Bronze', at: 300 }, { name: 'Silver', at: 900 },
    { name: 'Gold', at: 2000 }, { name: 'Platinum', at: 4000 }, { name: 'Aether', at: 7500 },
  ];
  const FORGE_COST = [250, 450, 700];
  const DIFF = {
    easy: { react: .55, err: .28, dodge: .15, aggr: .8, gap: .9, lead: .55 },
    normal: { react: .32, err: .13, dodge: .45, aggr: 1, gap: .5, lead: .85 },
    hard: { react: .16, err: .05, dodge: .8, aggr: 1.15, gap: .25, lead: 1 },
  };

  // ---------- helpers ----------
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const norm = (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l, l }; };
  function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const segDist = (px, py, ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
    const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
    return Math.hypot(px - ax - dx * t, py - ay - dy * t);
  };

  // ---------- map ----------
  function buildMap() {
    const quad = [[690, 480, 340, 64], [1170, 480, 250, 64], [1040, 700, 64, 170], [1260, 690, 190, 64], [560, 640, 80, 200]];
    const corner = [[0, 0, 330, 330]];
    const walls = [];
    const add = (r, solid) => {
      const [x, y, w, h] = r;
      for (const [mx, my] of [[0, 0], [1, 0], [0, 1], [1, 1]])
        walls.push({ x: mx ? W - x - w : x, y: my ? H - y - h : y, w, h, big: solid });
    };
    quad.forEach(r => add(r, false)); corner.forEach(r => add(r, true));
    const brush = [];
    for (const [x, y, r] of [[1000, 405, 95], [1470, 610, 105], [850, 620, 90]])
      for (const [mx, my] of [[0, 0], [1, 0], [0, 1], [1, 1]])
        brush.push({ x: mx ? W - x : x, y: my ? H - y : y, r });
    const top = [[250, 950], [430, 520], [800, 300], [1600, 240], [2400, 300], [2770, 520], [2950, 950]];
    const lanes = [top, top.map(([x, y]) => [x, H - y])];
    const cols = Math.ceil(W / 40), rows = Math.ceil(H / 40);
    const grid = new Uint8Array(cols * rows);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const px = i * 40 + 20, py = j * 40 + 20;
      let b = px < 50 || py < 120 || px > W - 50 || py > H - 120;
      for (const w of walls) if (px > w.x - 34 && px < w.x + w.w + 34 && py > w.y - 34 && py < w.y + w.h + 34) b = true;
      grid[j * cols + i] = b ? 1 : 0;
    }
    return { W, H, walls, brush, lanes, cols, rows, grid };
  }

  function blocked(m, x, y) {
    const i = x / 40 | 0, j = y / 40 | 0;
    if (i < 0 || j < 0 || i >= m.cols || j >= m.rows) return true;
    return !!m.grid[j * m.cols + i];
  }
  function los(m, ax, ay, bx, by) {
    const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 26);
    for (let k = 0; k <= n; k++) { const t = n ? k / n : 0; if (blocked(m, ax + (bx - ax) * t, ay + (by - ay) * t)) return false; }
    return true;
  }
  function nearestFree(m, x, y) {
    if (!blocked(m, x, y)) return { x, y };
    for (let r = 40; r < 400; r += 40) for (let a = 0; a < 12; a++) {
      const nx = x + Math.cos(a / 12 * 6.283) * r, ny = y + Math.sin(a / 12 * 6.283) * r;
      if (!blocked(m, nx, ny)) return { x: nx, y: ny };
    }
    return { x, y };
  }
  function findPath(m, ax, ay, bx, by) {
    const s0 = nearestFree(m, ax, ay), e0 = nearestFree(m, bx, by);
    const c = m.cols, st = (s0.y / 40 | 0) * c + (s0.x / 40 | 0), en = (e0.y / 40 | 0) * c + (e0.x / 40 | 0);
    const g = new Map([[st, 0]]), from = new Map(), heap = [[0, st]];
    const hOf = n => Math.hypot((n % c) - (en % c), (n / c | 0) - (en / c | 0));
    const push = it => { heap.push(it); let i = heap.length - 1; while (i) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break;[heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
    const pop = () => { const top = heap[0], l = heap.pop(); if (heap.length) { heap[0] = l; let i = 0; for (; ;) { let a = 2 * i + 1, b = a + 1, m2 = i; if (a < heap.length && heap[a][0] < heap[m2][0]) m2 = a; if (b < heap.length && heap[b][0] < heap[m2][0]) m2 = b; if (m2 === i) break;[heap[m2], heap[i]] = [heap[i], heap[m2]]; i = m2; } } return top; };
    let found = false, guard = 0;
    while (heap.length && guard++ < 6000) {
      const [, n] = pop(); if (n === en) { found = true; break; }
      const x = n % c, y = n / c | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue; const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= c || ny >= m.rows) continue;
        const k = ny * c + nx; if (m.grid[k]) continue;
        if (dx && dy && (m.grid[y * c + nx] || m.grid[ny * c + x])) continue;
        const ng = g.get(n) + (dx && dy ? 1.414 : 1);
        if (ng < (g.has(k) ? g.get(k) : 1e9)) { g.set(k, ng); from.set(k, n); push([ng + hOf(k), k]); }
      }
    }
    if (!found) return [{ x: bx, y: by }];
    const raw = []; for (let n = en; n !== undefined; n = from.get(n)) raw.unshift({ x: n % c * 40 + 20, y: (n / c | 0) * 40 + 20 });
    const out = []; let i = 0;
    while (i < raw.length - 1) { let j = raw.length - 1; while (j > i + 1 && !los(m, raw[i].x, raw[i].y, raw[j].x, raw[j].y)) j--; out.push(raw[j]); i = j; }
    if (!out.length) out.push({ x: e0.x, y: e0.y });
    return out;
  }

  function pushOut(m, u) {
    for (const w of m.walls) {
      const cx = clamp(u.x, w.x, w.x + w.w), cy = clamp(u.y, w.y, w.y + w.h);
      let dx = u.x - cx, dy = u.y - cy, d = Math.hypot(dx, dy);
      if (d < u.r) {
        if (d < .01) {
          const l = u.x - w.x, r = w.x + w.w - u.x, t = u.y - w.y, b = w.y + w.h - u.y, mn = Math.min(l, r, t, b);
          if (mn === l) u.x = w.x - u.r; else if (mn === r) u.x = w.x + w.w + u.r; else if (mn === t) u.y = w.y - u.r; else u.y = w.y + w.h + u.r;
        } else { u.x = cx + dx / d * u.r; u.y = cy + dy / d * u.r; }
      }
    }
    u.x = clamp(u.x, 40, W - 40); u.y = clamp(u.y, 110, H - 110);
  }

  // ---------- champion kits ----------
  const pow = c => (1 + .09 * (c.lvl - 1)) * (1 + .13 * c.up.edge) * (c.buffT > 0 ? 1.2 : 1);

  function fire(s, c, aim, o) {
    s.proj.push({
      id: s.nid++, x: c.x, y: c.y, px: c.x, py: c.y, vx: aim.dx * o.speed, vy: aim.dy * o.speed, left: o.range, w: o.w,
      team: c.team, owner: c, fx: o.fx, pierce: o.pierce, hits: new Set(), filter: o.filter || 'units', hit: o.hit, skill: true, counted: false, age: 0,
    });
    s.ev.push({ e: 'cast', u: c.id, fx: o.fx });
  }
  function dashDir(c, dx, dy, d, speed, o = {}) { c.dash = Object.assign({ vx: dx * speed, vy: dy * speed, t: d / speed, hits: new Set() }, o); }
  function blast(s, c, x, y, r, delay, fn, fx) { s.zones.push({ id: s.nid++, kind: 'blast', x, y, r, t: delay, total: delay, team: c.team, owner: c, fn, fx, counted: false }); }
  function eachEnemy(s, c, x, y, r, fn, withMinions = true) {
    let n = 0; const test = u => { if (u.alive && !u.air && u.team !== c.team && Math.hypot(u.x - x, u.y - y) <= r + u.r) { fn(u); n++; } };
    s.champs.forEach(test); if (withMinions) { s.minions.forEach(test); s.monsters.forEach(test); }
    return n;
  }
  const stun = (s, t, d) => { if (t.kind === 'tower' || t.boss) return; t.stunT = Math.max(t.stunT || 0, d); if (t.dash && !t.dash.unstop && !t.dash.forced) t.dash = null; t.chan = null; s.ev.push({ e: 'stun', u: t.id }); };
  const slow = (t, a, d) => { t.slowA = Math.max(t.slowT > 0 ? t.slowA : 0, a); t.slowT = Math.max(t.slowT || 0, d); };
  const skillHit = (c, carrier) => { if (carrier && !carrier.counted) { carrier.counted = true; c.stats.skillHits++; } };
  const nearChamp = (s, c, x, y, maxD) => { let b = null, bd = maxD; for (const e of s.champs) { if (!e.alive || e.air || e.team === c.team || !canSee(s, c.team, e)) continue; const d = Math.hypot(e.x - x, e.y - y); if (d < bd) { b = e; bd = d; } } return b; };

  // bot aim helpers
  function lead(s, c, b, t, speed) {
    const d = dist(c, t), tt = speed ? d / speed : 0; const f = b.sk.lead * (.75 + s.rand() * .25);
    let x = t.x + t.vx * tt * f, y = t.y + t.vy * tt * f;
    const a = Math.atan2(y - c.y, x - c.x) + (s.rand() - .5) * b.sk.err, l = Math.hypot(x - c.x, y - c.y);
    return { tx: c.x + Math.cos(a) * l, ty: c.y + Math.sin(a) * l };
  }
  const cmd = (c, o) => c.q.push(o);

  const KITS = {
    vesper: {
      name: 'Vesper', role: 'Sniper', blurb: 'Charge your shot while they try to read it.',
      hp: 520, hpG: 72, dmg: 56, dmgG: 7, armor: 16, armG: 3, range: 430, as: 1.0, ms: 305, forge: ['edge', 'haste', 'guard'], pref: 390,
      kit: [
        { name: 'Long Shot', d: 'Hold to charge. A full charge pierces.', cd: 6, range: 900, shape: 'line', w: 34, charge: 1.1,
          cast(s, c, a) {
            const f = c.charge ? clamp(c.charge.t / 1.1, 0, 1) : 0; c.charge = null;
            fire(s, c, a, { speed: 1600, range: 560 + 340 * f, w: 28 + 8 * f, fx: f >= 1 ? 'snipeFull' : 'snipe', pierce: f >= 1, filter: 'units',
              hit(s, c, t, p) { hurt(s, c, t, (70 + 120 * f) * pow(c), { skill: 1 }); if (t.kind === 'champ') skillHit(c, p); } });
          },
          ai(s, c, b, t, d) { if (d > 780) return false; if (!b.chargeT) { cmd(c, { t: 'charge', slot: 0 }); b.chargeT = s.t + .55 + s.rand() * .55; return true; } return false; } },
        { name: 'Smoke Step', d: 'Dash. Your next basic attack hits harder.', cd: 9, range: 270, shape: 'dash', w: 60,
          cast(s, c, a) { dashDir(c, a.dx, a.dy, 270, 1200); c.empowerT = 3; s.ev.push({ e: 'cast', u: c.id, fx: 'dash' }); },
          ai(s, c, b, t, d) { if (d > 300 && c.hp / c.maxHp > .4) return false; const n = norm(c.x - t.x, c.y - t.y); cmd(c, { t: 'cast', slot: 1, tx: c.x + n.x * 270 - n.y * 90, ty: c.y + n.y * 270 + n.x * 90 }); return true; } },
        { name: 'Deadeye', d: 'A map-crossing shot. Everyone sees it coming.', cd: 50, range: 1900, shape: 'line', w: 50,
          cast(s, c, a) {
            c.chan = { t: .85, total: .85, kind: 'line', dx: a.dx, dy: a.dy, len: 1900, w: 50, fn(s, c) {
              fire(s, c, a, { speed: 2600, range: 1900, w: 50, fx: 'deadeye', filter: 'champ', hit(s, c, t, p) { hurt(s, c, t, 260 * pow(c), { skill: 1 }); skillHit(c, p); p.left = 0; } });
            } };
          },
          ai(s, c, b, t, d) { if (d > 1300 || t.hp / t.maxHp > .55 || Math.hypot(t.vx, t.vy) > 330) return false; const p = lead(s, c, b, t, 2200); cmd(c, { t: 'cast', slot: 2, tx: p.tx, ty: p.ty }); return true; } },
      ],
    },
    kade: {
      name: 'Kade', role: 'Duelist', blurb: 'Time the parry and the fight is yours.',
      hp: 640, hpG: 95, dmg: 64, dmgG: 8, armor: 28, armG: 4, range: 150, as: .95, ms: 325, forge: ['edge', 'guard', 'haste'], pref: 100, melee: true,
      kit: [

    ctx.textAlign = 'left'; ctx.fillStyle = '#f7a08e'; ctx.fillText(s.kills[1], VW / 2 + 34, 22);
    font(600, 15); ctx.textAlign = 'center'; ctx.fillStyle = '#f1e8d0'; ctx.fillText(`${m}:${sec}`, VW / 2, 22);
    const P = UI.pause; ctx.fillStyle = 'rgba(241,232,208,.8)'; ctx.fillRect(P.x - 5, P.y - 7, 3.5, 14); ctx.fillRect(P.x + 2, P.y - 7, 3.5, 14);

    // feed
    G.feed.forEach((f, i) => { f.t -= 1 / 60; if (f.t <= 0) return; const y = 48 + i * 22, al = Math.min(1, f.t * 2); ctx.globalAlpha = al; const X = VW / 2; if (f.a && f.a.kind === 'champ') drawHudCoin(X - 34, y, 10, spriteOf(f.a)); else { ctx.fillStyle = '#d9c9a0'; ctx.beginPath(); ctx.arc(X - 34, y, 7, 0, TAU); ctx.fill(); } font(700, 13); ctx.fillStyle = '#f1e8d0'; ctx.fillText('took', X, y); if (f.b) drawHudCoin(X + 34, y, 10, spriteOf(f.b)); ctx.globalAlpha = 1; });
    G.feed = G.feed.filter(f => f.t > 0);

    minimap();
    if (G.banner) { G.banner.t -= 1 / 60; if (G.banner.t <= 0) G.banner = null; else { font(600, 19); ctx.textAlign = 'center'; const tw = ctx.measureText(G.banner.s).width + 32; ctx.globalAlpha = Math.min(1, G.banner.t * 3); ctx.fillStyle = 'rgba(10,36,32,.82)'; ctx.beginPath(); roundR(VW / 2 - tw / 2, 110, tw, 32, 15); ctx.fill(); ctx.fillStyle = '#f1e8d0'; ctx.fillText(G.banner.s, VW / 2, 126.5); ctx.globalAlpha = 1; } }

    // buttons
    const A = UI.atk; drawHudCoin(A.x, A.y, A.r, Art.champCoin(me.champ, me.team, me.tier)); if (Ctl.atk !== null) { ctx.strokeStyle = '#fff4cf'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(A.x, A.y, A.r + 3, 0, TAU); ctx.stroke(); }
    me.kit.forEach((a, i) => {
      const B = UI.ab[i], locked = i === 2 && me.lvl < 3, cd = me.cd[i], recast = me.recast[i] > 0 && a.recast, ready = (cd <= 0 && !locked) || recast;
      const held = Ctl.aim && Ctl.aim.slot === i;
      ctx.fillStyle = ready ? '#25584e' : '#13302b'; ctx.beginPath(); ctx.arc(B.x, B.y, B.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = recast ? '#ffe69a' : ready ? '#d7b35e' : '#4e6a60'; ctx.lineWidth = recast ? 4 : 3; ctx.beginPath(); ctx.arc(B.x, B.y, B.r, 0, TAU); ctx.stroke();
      glyph(a, B.x, B.y - 8, B.r * .82, ready ? '#f4e8c8' : '#7d968c');
      { let fs = 11.5; font(600, fs); while (ctx.measureText(a.name).width > B.r * 1.52 && fs > 8.5) { fs -= .5; font(600, fs); } ctx.textAlign = 'center'; ctx.fillStyle = ready ? '#f1e8d0' : '#9ab0a6'; ctx.fillText(a.name, B.x, B.y + B.r * .55); }
      if (cd > 0 && !recast) { const f = cd / a.cd; ctx.fillStyle = 'rgba(4,16,14,.62)'; ctx.beginPath(); ctx.moveTo(B.x, B.y); ctx.arc(B.x, B.y, B.r - 1, -Math.PI / 2, -Math.PI / 2 + TAU * f); ctx.closePath(); ctx.fill(); font(700, 19); ctx.fillStyle = '#fff'; ctx.fillText(cd > 3 ? Math.ceil(cd) : cd.toFixed(1), B.x, B.y - 2); }
      if (locked) { font(700, 12); ctx.fillStyle = '#f1e8d0'; ctx.fillText('Lv 3', B.x, B.y - 3); }
      if (held) { ctx.strokeStyle = '#fff4cf'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(B.x, B.y, B.r + 4, 0, TAU); ctx.stroke(); }
      if (held && me.charge) { const f = Math.min(1, me.charge.t / 1.1); ctx.strokeStyle = f >= 1 ? '#ffe06a' : '#b8a9ff'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(B.x, B.y, B.r + 9, -Math.PI / 2, -Math.PI / 2 + TAU * f); ctx.stroke(); }
    });
    if (Ctl.aim && Ctl.aim.moved && Math.hypot(Ctl.aim.dx, Ctl.aim.dy) < 16) { font(700, 13); ctx.textAlign = 'center'; const B = UI.ab[Ctl.aim.slot]; ctx.fillStyle = '#ff8b78'; ctx.fillText('Release to cancel', B.x, B.y - B.r - 16); }
    // thumb stick
    if (Ctl.stick) { const st = Ctl.stick; ctx.strokeStyle = 'rgba(241,232,208,.5)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(st.sx, st.sy, 58, 0, TAU); ctx.stroke(); const dx = st.x - st.sx, dy = st.y - st.sy, l = Math.min(58, Math.hypot(dx, dy)), a = Math.atan2(dy, dx); ctx.fillStyle = 'rgba(241,232,208,.55)'; ctx.beginPath(); ctx.arc(st.sx + Math.cos(a) * l, st.sy + Math.sin(a) * l, 24, 0, TAU); ctx.fill(); }
    else if (G.s.t < 30) { ctx.strokeStyle = 'rgba(241,232,208,.2)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(120, VH - 86, 56, 0, TAU); ctx.stroke(); }

    if (G.hintT > 0) { G.hintT -= 1 / 60; font(600, 18); ctx.textAlign = 'center'; ctx.globalAlpha = Math.min(1, G.hintT); ctx.fillStyle = 'rgba(10,36,32,.8)'; const t1 = 'Left thumb moves. Hold the big coin to attack. Drag an ability to aim, or tap to fire at the nearest target.'; const tw = ctx.measureText(t1).width + 30, xx = Math.min(tw, VW - 60); ctx.beginPath(); roundR(VW / 2 - xx / 2, VH - 44, xx, 32, 14); ctx.fill(); ctx.fillStyle = '#f1e8d0'; wrapOne(t1, VW / 2, VH - 28, xx - 20); ctx.globalAlpha = 1; }

    if (!me.alive) { ctx.fillStyle = 'rgba(8,24,22,.42)'; ctx.fillRect(0, 0, VW, VH); ctx.fillStyle = '#f1e8d0'; ctx.textAlign = 'center'; ctx.font = '38px Forum,Georgia,serif'; ctx.fillText(`Back in ${Math.ceil(me.respawn)}`, VW / 2, VH / 2 - 10); }
    if (G.flash > 0) { ctx.fillStyle = `rgba(228,67,50,${G.flash * .3})`; ctx.fillRect(0, 0, VW, VH); }
  }
  function wrapOne(t, x, y, mw) { let f = 18; font(600, f); while (ctx.measureText(t).width > mw && f > 11) { f--; font(600, f); } ctx.fillText(t, x, y); }
  function drawHudCoin(x, y, r, spr) { const k = spr.S / (spr.R * 2); ctx.drawImage(spr.c, x - r * k, y - r * k, 2 * r * k, 2 * r * k); }
  function pill(B, t, hot, prog) { ctx.fillStyle = hot ? '#e0b552' : 'rgba(10,36,32,.72)'; ctx.beginPath(); roundR(B.x, B.y, B.w, B.h, 15); ctx.fill(); if (prog) { ctx.save(); ctx.beginPath(); roundR(B.x, B.y, B.w, B.h, 15); ctx.clip(); ctx.fillStyle = 'rgba(88,166,230,.65)'; ctx.fillRect(B.x, B.y, B.w * prog, B.h); ctx.restore(); } font(700, 16); ctx.textAlign = 'center'; ctx.fillStyle = hot ? '#2a1c06' : '#f1e8d0'; ctx.fillText(t, B.x + B.w / 2, B.y + B.h / 2 + 1); }

  function minimap() {
    const M = UI.map, s = G.s, kx = M.w / Sim.W, ky = M.h / Sim.H, X = x => M.x + x * kx, Y = y => M.y + y * ky;
    ctx.fillStyle = 'rgba(10,36,32,.82)'; ctx.beginPath(); roundR(M.x - 3, M.y - 3, M.w + 6, M.h + 6, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(190,180,140,.55)'; ctx.lineWidth = 3; for (const L of s.map.lanes) { ctx.beginPath(); L.forEach(([x, y], i) => ctx[i ? 'lineTo' : 'moveTo'](X(x), Y(y))); ctx.stroke(); }
    ctx.fillStyle = 'rgba(100,130,120,.6)'; for (const w of s.map.walls) if (!w.big) ctx.fillRect(X(w.x), Y(w.y), w.w * kx, w.h * ky);
    for (const t of s.towers) if (t.alive) { ctx.fillStyle = TEAM[t.team]; const r = t.sub === 'core' ? 3.8 : 2.4; ctx.fillRect(X(t.x) - r, Y(t.y) - r, 2 * r, 2 * r); }
    if (s.monsters.some(m => m.boss)) { ctx.fillStyle = '#ffd777'; ctx.beginPath(); ctx.arc(X(1600), Y(950), 4, 0, TAU); ctx.fill(); }
    for (const c of s.champs) { if (!c.alive || !Sim.canSee(s, me0().team, c)) continue; ctx.fillStyle = c === me0() ? '#fff4cf' : TEAM[c.team]; ctx.beginPath(); ctx.arc(X(c.x), Y(c.y), c === me0() ? 4.4 : 3.4, 0, TAU); ctx.fill(); }
  }
  const me0 = () => G.me;

  function endGame() {
    const s = G.s, me = G.me, won = s.over.winner === me.team, gain = Sim.masteryGain(me.stats, won), before = pts(me.champ), t0 = Sim.tierOf(before), t1 = Sim.tierOf(before + gain);
    save.m[me.champ] = before + gain; persist(); G.ended = true; $('forge').classList.add('hide');
    $('endT').textContent = won ? 'Victory' : 'Defeat';
    const st = me.stats; $('endS').textContent = `${st.kills} takedowns, ${st.deaths} deaths, ${st.assists} assists. You landed ${st.skillHits} of ${st.casts} abilities${st.parries ? ` and parried ${st.parries} hits` : ''}.`;
    const next = Sim.TIERS[t1 + 1];
    $('endM').textContent = (t1 > t0 ? `Your ${Sim.KITS[me.champ].name} coin is now ${Sim.TIERS[t1].name}. ` : '') + `+${gain} proficiency` + (next ? `, ${next.at - before - gain} to ${next.name}` : '');
    paintCoinTo($('endcoin'), Art.coin(me.champ, 140, me.champ, Art.METAL[me.champ], me.team, t1));
    $('end').classList.remove('hide');
  }

  // ---------- main loop ----------
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    animLobby(dt);
    if (!G) return;
    G.t += dt;
    if (!paused && !G.ended) {
      G.acc += dt; let n = 0;
      while (G.acc >= DT && n++ < 4) { applyInput(); Sim.step(G.s); G.acc -= DT; handleEvents(); if (G.s.over) { endGame(); break; } }
      if (n >= 4) G.acc = 0;
    }
    render(paused ? 0 : dt);
    const f = G.frames++; G.ms += dt * 1000;
    if (f && f % 120 === 0) { const avg = G.ms / 120; G.ms = 0; if (avg > 26 && quality > 0) { quality--; resize(); } }
  }

  function render(dt) {
    const s = G.s, me = G.me, a = Math.min(1, G.acc / DT);
    // camera follows the coin and leans toward your aim
    const p = pos(me, a); let tx = p.x, ty = p.y;
    if (Ctl.aim && Ctl.aim.moved) { const wx = Ctl.aim.dx, wy = Ctl.aim.dy / TILT, l = Math.hypot(wx, wy) || 1; tx += wx / l * 200; ty += wy / l * 130; }
    G.cam.x = lerp(G.cam.x, tx, .14); G.cam.y = lerp(G.cam.y, ty, .14);
    if (!calm && G.shake > .1) { shX = (Math.random() - .5) * G.shake; shY = (Math.random() - .5) * G.shake; G.shake *= .86; } else shX = shY = 0;
    G.flash = Math.max(0, G.flash - dt * 2.6);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0f3029'; ctx.fillRect(0, 0, VW, VH);
    // ground in one blit
    const gw = VW / Z, gh = VH / Z, gx = G.cam.x - gw / 2 - shX / Z, gy = G.cam.y * TILT - gh / 2 - shY / Z;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(G.ground.c, gx, gy, gw, gh, 0, 0, VW, VH);

    telegraphs(a);

    const list = []; G.hpq = [];
    for (const w of s.map.walls) { if (!onScreen(w.x + w.w / 2, w.y + w.h / 2, Math.max(w.w, w.h) * Z + 120)) continue; if (w.big) continue; list.push({ y: w.y + w.h, f() { const sp = Art.wallSprite(w); ctx.drawImage(sp.c, sx(w.x) - 4 * Z, sy(w.y) - sp.lift * Z - 4 * Z, sp.c.width * Z, sp.c.height * Z); } }); }
    for (const d of G.decor) { if (!onScreen(d.x, d.y, 140)) continue; list.push({ y: d.y, f() { const sp = Art.treeSprite(d.v); ctx.drawImage(sp.c, sx(d.x) - sp.ax * Z, sy(d.y) - sp.ay * Z, sp.c.width * Z, sp.c.height * Z); } }); }
    s.map.brush.forEach((b, i) => { if (!onScreen(b.x, b.y, b.r + 80)) return; list.push({ y: b.y + b.r * .4, f() { const sp = Art.brushSprite(b, i % 3 + 1), sway = Math.sin(G.t * 1.5 + i) * 2.5 * Z; ctx.globalAlpha = me.alive && me.inBrush === i ? .42 : 1; ctx.drawImage(sp.c, sx(b.x) - sp.ax * Z + sway, sy(b.y) - sp.ay * Z, sp.c.width * Z, sp.c.height * Z); ctx.globalAlpha = 1; } }); });
    for (const t of s.towers) drawTower(t, list);
    for (const m of s.minions) {
      if (m.delay > 0) continue; const q = pos(m, a); if (!onScreen(q.x, q.y)) continue; const v = visOf(m);
      list.push({ y: q.y, f() { v.hop += .32; v.flash = Math.max(0, v.flash - .12); const z = 8 + Math.abs(Math.sin(v.hop)) * 6; drawCoin(spriteOf(m), sx(q.x), sy(q.y), z, drawR(m), { flash: v.flash, edge: m.team ? '#6a2c20' : '#2a4f70' }); if (m.hp < m.maxHp) G.hpq.push(() => bar(sx(q.x) - 18 * Z, sy(q.y) - 46 * Z, 36 * Z, 3.5, pct(m.hp, m.maxHp), m.team === me.team ? '#58a6e6' : '#e4573f')); } });
    }
    for (const m of s.monsters) {
      const q = pos(m, a); if (!onScreen(q.x, q.y, 120)) continue; const v = visOf(m);
      list.push({ y: q.y, f() { v.hop += .05; v.flash = Math.max(0, v.flash - .12); const z = m.boss ? 22 + Math.sin(G.t * 1.8) * 5 : 8 + Math.abs(Math.sin(v.hop)) * 4; drawCoin(spriteOf(m), sx(q.x), sy(q.y), z, drawR(m), { flash: v.flash, spin: m.boss ? Math.cos(G.t * .7) : 1, edge: m.boss ? '#8a5d0c' : '#3a2f1c' }); if (m.hp < m.maxHp) G.hpq.push(() => bar(sx(q.x) - drawR(m) * Z, sy(q.y) - (drawR(m) + 34) * Z, drawR(m) * 2 * Z, m.boss ? 7 : 4, pct(m.hp, m.maxHp), '#e0b552')); } });
    }
    for (const c of s.champs) drawChamp(c, a, list);
    // corpses flip and sink
    G.corpses = G.corpses.filter(k => (k.t += dt) < .75);
    for (const k of G.corpses) { if (!onScreen(k.x, k.y)) continue; list.push({ y: k.y, f() { const f = k.t / .75; drawCoin(k.spr, sx(k.x), sy(k.y), 14 + Math.sin(f * Math.PI) * 74, k.R, { flip: Math.cos(f * Math.PI * 3), alpha: 1 - f * f }); } }); }
    list.sort((p, q) => p.y - q.y);
    for (const it of list) it.f();
    drawProjectiles(a);
    drawParticles(dt);
    const sk = sky(); weather(dt, sk);
    for (const f of G.hpq) f();
    // floating numbers
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    G.text = G.text.filter(t => (t.t -= dt) > 0);
    for (const t of G.text) { const f = t.t / t.max; font(700, t.big ? 20 : 15); ctx.globalAlpha = Math.min(1, f * 2.4); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(8,24,22,.8)'; const X = sx(t.x), Y = sy(t.y) - (t.z + (1 - f) * 46) * Z; ctx.strokeText(t.s, X, Y); ctx.fillStyle = t.col; ctx.fillText(t.s, X, Y); ctx.globalAlpha = 1; }
    hudDraw();
    if (!$('forge').classList.contains('hide') && G.frames % 20 === 0) drawForge();
  }

  layout(); renderLobby(); requestAnimationFrame(frame);
  window.__mintfall = { get G() { return G; }, Ctl, UI: () => UI };
})();
