<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flipside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14102a;--paper:#fff7df;--sun:#ffd51e;--ultra:#1c37d8;--ultra2:#101f9c;--sky:#5f8dff;--violet:#6b1fd6;--violet2:#2e0a6e;--toxic:#8dff2a;--blood:#ff5a1f;
--disp:Bangers,Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif;
--a:var(--ultra);--a2:var(--ultra2);--b:var(--sun);--c:#fff;--dark:#0b1466;
--o2:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink);
--o3:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2.2px 2.2px 0 var(--ink),-2.2px 2.2px 0 var(--ink),2.2px -2.2px 0 var(--ink),-2.2px -2.2px 0 var(--ink);
--dots:radial-gradient(circle,rgba(20,16,42,.34) 1.7px,transparent 2px) 0 0/7px 7px}
.s0{--a:var(--ultra);--a2:var(--ultra2);--b:var(--sun);--c:#fff;--dark:#0b1466}
.s1{--a:var(--violet);--a2:var(--violet2);--b:var(--toxic);--c:var(--blood);--dark:#190644}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;color:var(--ink);font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-weight:600}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;overflow:clip;background:var(--ink)}
canvas#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #fff;outline-offset:2px}
h1,h2,h3,p{margin:0;font-weight:inherit}
.hide{display:none!important}
.scroll{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.d{font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.035em;line-height:1}

/* Comic panels and stickers */
.plate{background:var(--paper);border:3px solid var(--ink);border-radius:5px;box-shadow:5px 5px 0 var(--ink);color:var(--ink)}
.go,.ghost,.tok{position:relative;border:3px solid var(--ink);transition:transform .07s;touch-action:manipulation}
.go{height:50px;padding:0 24px;border-radius:9px;color:var(--ink);background:var(--b);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(20,16,42,.18),0 0 0 2px #fff,3px 5px 0 2px var(--ink);font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:25px;line-height:1;letter-spacing:.035em;text-transform:uppercase;transform:rotate(-1.5deg)}
.go:active{transform:translate(3px,4px) scale(.95) rotate(-1.5deg);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(20,16,42,.18),0 0 0 2px #fff,0 1px 0 2px var(--ink)}
.ghost{min-height:46px;padding:0 16px;border-radius:9px;font-size:17px;font-weight:700;color:var(--ink);background:#fff;box-shadow:3px 4px 0 var(--ink);transform:rotate(1deg)}
.ghost:active{transform:translate(2px,3px) scale(.96) rotate(1deg);box-shadow:1px 1px 0 var(--ink)}
.tok{min-height:38px;padding:0 13px;border-radius:9px;font-size:15px;font-weight:700;background:#fff;box-shadow:2px 3px 0 var(--ink)}
.tok:active{transform:translate(2px,2px) scale(.95);box-shadow:0 1px 0 var(--ink)}
.seg{display:flex;align-items:center;gap:3px;font-size:15px;font-weight:700;color:#fff;text-shadow:var(--o2)}
.seg>span{margin-right:4px}
.seg button{min-width:44px;min-height:38px;padding:0 9px;border-radius:9px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);text-shadow:none;font-weight:700;box-shadow:2px 2px 0 var(--ink);transition:transform .07s}
.seg button:active{transform:translate(2px,2px) scale(.95);box-shadow:none}
.seg button[aria-pressed=true]{background:var(--b);transform:rotate(-3deg) scale(1.05);animation:bump .22s ease-out}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{display:block;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.pips i.on{background:var(--b)}
@keyframes pop{0%{transform:scale(.55) rotate(-5deg);opacity:0}60%{transform:scale(1.07) rotate(1deg);opacity:1}100%{}}
@keyframes bump{40%{transform:scale(1.3) rotate(-4deg)}}
@keyframes slam{0%{transform:scale(2.5) rotate(-9deg);opacity:0}45%{transform:scale(.93) rotate(1deg);opacity:1}70%{transform:scale(1.05)}100%{}}
@keyframes wob{0%,100%{transform:rotate(-6deg) translateY(-3px) scale(1.14)}50%{transform:rotate(6deg) translateY(-3px) scale(1.14)}}
@keyframes pulse{50%{transform:scale(1.07) rotate(-1deg)}}
@keyframes fadein{from{opacity:0}}

/* Title */
#title{position:absolute;inset:0;display:block;width:100%;height:100%;text-align:left;overflow:hidden;background:repeating-conic-gradient(from 4deg at 29% 50%,var(--a) 0 9deg,var(--a2) 9deg 18deg)}
#title::before{content:"";position:absolute;inset:0;background:var(--dots);-webkit-mask-image:linear-gradient(115deg,transparent 45%,#000 95%);mask-image:linear-gradient(115deg,transparent 45%,#000 95%)}
#tcan{position:absolute;inset:0;width:100%;height:100%;display:block}
.tword{position:absolute;left:49%;top:50%;transform:translateY(-54%) rotate(-4deg);display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.tword b{display:block;font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;font-size:88px;line-height:.92;white-space:nowrap;letter-spacing:.02em;color:var(--b);text-shadow:4px 0 0 var(--ink),-4px 0 0 var(--ink),0 4px 0 var(--ink),0 -4px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),8px 9px 0 var(--ink)}
.tword em{display:inline-block;font-style:normal;font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.05em;font-size:24px;line-height:1;padding:9px 18px 8px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:8px;box-shadow:4px 5px 0 var(--ink);animation:pulse .9s ease-in-out infinite}

/* Lobby */
#lobby{position:absolute;inset:0;z-index:0;overflow:hidden;overflow:clip;display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 236px;grid-template-rows:42px minmax(0,1fr) 74px;gap:6px 14px;padding:8px 44px;background:repeating-conic-gradient(from 4deg at 17% 47%,var(--a) 0 9deg,var(--a2) 9deg 18deg)}
#lobby::before{content:"";position:absolute;inset:0;background:var(--dots);pointer-events:none;-webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 100%);mask-image:linear-gradient(100deg,transparent 30%,#000 100%)}
#lobby>*{position:relative;min-width:0;min-height:0}
.ltop{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}
.ltop h1{font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.03em;font-size:30px;line-height:1;color:#fff;text-shadow:var(--o2),3px 4px 0 var(--ink);transform:rotate(-3deg)}
.ltop>div{display:flex;align-items:center;gap:8px}
.mission{flex:1;display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.mission b{font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.04em;font-size:21px;line-height:1;padding:4px 10px 3px;background:var(--b);color:var(--ink);border:2.5px solid var(--ink);box-shadow:2px 3px 0 var(--ink);transform:rotate(-2deg)}
.mission span{font-size:16px;font-weight:700;color:#fff;text-shadow:var(--o2)}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;pointer-events:none}
.hero canvas#big{position:absolute;left:50%;top:50%;height:118%;aspect-ratio:1;transform:translate(-50%,-54%);display:block;z-index:0}
.herotag{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto;background:var(--ink);padding:3px 10px 4px;border-radius:13px}
.ladder{display:flex;gap:3px;align-items:center;justify-content:center}
.rung{width:26px;height:26px;border-radius:50%;padding:2px;position:relative;opacity:.45;filter:saturate(.25)}
.rung canvas{display:block;width:100%;height:100%}
.rung.done{opacity:1;filter:none}
.rung.now{opacity:1;filter:none;background:conic-gradient(var(--b) calc(var(--p)*1%),rgba(255,255,255,.3) 0)}
.lad{font-size:13px;font-weight:700;color:#fff;text-align:center;line-height:1.1;white-space:nowrap}
.who{display:flex;flex-direction:column;gap:5px;justify-content:center;z-index:1}
.nm{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.nm h2{font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.03em;font-size:44px;line-height:.95;color:var(--b);text-shadow:var(--o3),4px 5px 0 var(--ink);transform:rotate(-2deg);transform-origin:left;white-space:nowrap}
.nm h2.long{font-size:32px}
.nm h2.pop{animation:namein .24s ease-out}
@keyframes namein{0%{transform:scale(1.45) rotate(-5deg);opacity:.2}60%{transform:scale(.96) rotate(-1deg);opacity:1}100%{transform:rotate(-2deg)}}
.nmsub{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0;max-width:100%}
.blurb{font-size:14px;font-weight:700;color:#fff;text-shadow:var(--o2);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding:2px}
.tags{display:flex;gap:4px;flex:none}
.tags span{font-size:13px;font-weight:700;padding:1px 7px;background:#fff;border:2px solid var(--ink);color:var(--ink);line-height:1.2;transform:rotate(-1deg)}
.tags span:nth-child(2){background:var(--b);transform:rotate(1.2deg)}
.abilbox{background:var(--paper);border:3px solid var(--ink);box-shadow:4px 5px 0 var(--ink);padding:6px 9px;transform:rotate(.5deg)}
.abil{display:grid;gap:3px}
.abil>div{display:grid;grid-template-columns:34px minmax(0,1fr);gap:7px;align-items:center;font-size:12.5px;line-height:1.08}
.abil img{width:34px;height:34px;display:block;border-radius:50%;border:2.5px solid var(--ink)}
.abil em{font-style:normal;white-space:nowrap;font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.03em;font-size:15.5px;line-height:1;color:var(--a2)}
.abil u{text-decoration:none;font-size:11.5px;font-weight:700;color:#000;background:var(--b);border:1.5px solid var(--ink);padding:0 4px;margin-left:5px;white-space:nowrap;vertical-align:1px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px 9px;align-items:center;font-size:10.5px;font-weight:700;line-height:1;margin-top:5px}
.stats>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats em{font-style:normal;font-size:12.5px;line-height:7px}
.stats i{display:block;height:7px;border:1.5px solid var(--ink);background:#fff;overflow:hidden}
.stats i b{display:block;height:100%;background:var(--a)}
.picks{grid-column:1/3;display:flex;gap:8px;align-items:center;justify-content:center;padding:3px 10px;background:var(--ink);border-radius:8px;transform:rotate(-.5deg);box-shadow:4px 5px 0 rgba(20,16,42,.45)}
.pick{width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;border-radius:10px;transition:transform .08s;touch-action:manipulation}
.pick canvas{width:50px;height:50px;display:block}
.pick .pips i{width:8px;height:8px}
.pick:active{transform:scale(.9)}
.pick[aria-pressed=true]{animation:wob 1.8s ease-in-out infinite;background:var(--b)}
.pick[aria-pressed=true] .pips i{background:#fff}.pick[aria-pressed=true] .pips i.on{background:var(--ink)}
.side{grid-column:3;grid-row:2/4;display:flex;flex-direction:column;justify-content:center;gap:8px}
.team{padding:5px 7px 6px;border:3px solid var(--ink);box-shadow:4px 5px 0 var(--ink)}
.team.t0{background:var(--ultra);transform:rotate(-.7deg)}
.team.t1{background:var(--violet);transform:rotate(.7deg)}
.team h3{font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.05em;font-size:18px;line-height:1;margin-bottom:3px;text-shadow:var(--o2)}
.team.t0 h3{color:var(--sun)}.team.t1 h3{color:var(--toxic)}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.seat{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.seatc{position:relative;width:46px;height:46px;border-radius:50%;display:block;transition:transform .08s}
.seatc:active{transform:scale(.88)}
.seatc canvas{width:100%;height:100%;display:block}
.seatc .pips{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);gap:1px;padding:0 2px 1px;background:var(--ink);border-radius:5px}
.seatc .pips i{width:6px;height:6px;border-width:1px}
.seat.me .seatc{outline:3px solid var(--sun);outline-offset:1px}
.chip{font-size:12px;font-weight:700;line-height:1.15;color:#fff;text-shadow:0 1px 0 var(--ink);white-space:nowrap}
.sit,.you{height:26px;width:100%;max-width:58px;border-radius:7px;font-size:12px;font-weight:700;line-height:20px;text-align:center;white-space:nowrap;border:2.5px solid var(--ink)}
.sit{background:#fff;color:var(--ink);box-shadow:1.5px 2px 0 var(--ink);transition:transform .07s}
.sit:active{transform:translate(1px,2px) scale(.95);box-shadow:none}
.you{background:var(--sun);color:var(--ink);display:block}
.acts{display:flex;gap:9px;align-items:center;padding:0 2px}
.acts .ghost{flex:none;width:80px;padding:0 4px;font-size:13.5px;line-height:1.04;white-space:normal}
.acts .go{flex:1 1 0;min-width:0;padding:0 4px;font-size:21px;height:50px;line-height:.92;white-space:normal}
#lobby.enter .ltop{animation:drop .28s ease-out both}
#lobby.enter .who{animation:pop .36s .06s both}
#lobby.enter .team.t0{animation:pop .34s .1s both}
#lobby.enter .team.t1{animation:pop .34s .16s both}
#lobby.enter .acts{animation:pop .34s .22s both}
#lobby.enter .picks{animation:rise .3s .14s both}
@keyframes drop{from{transform:translateY(-120%)}}
@keyframes rise{from{transform:translateY(130%) rotate(-.5deg)}}

/* Sheets */
.over{position:absolute;inset:0;background:rgba(20,16,42,.82);display:flex;align-items:center;justify-content:center;padding:8px 44px}
.over .plate{animation:pop .24s ease-out both}
.sheet{width:100%;max-width:660px;max-height:100%;padding:11px 15px;display:flex;flex-direction:column;gap:8px;transform:rotate(-.4deg)}
.shead{display:flex;align-items:center;gap:8px;min-height:44px}
.shead h3{flex:1;font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.03em;font-size:27px;line-height:1;color:var(--a2)}
.shead small{font-family:"Barlow Semi Condensed",sans-serif;text-transform:none;letter-spacing:0;font-size:15px;font-weight:700;color:var(--ink);margin-left:8px}
.shead .go{height:44px;font-size:20px;padding:0 20px}
.shead .ghost{min-height:44px}
.sbody{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px}
.spick{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-content:start}
.schamp{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border:2.5px solid var(--ink);border-radius:7px;font-size:14px;font-weight:700;line-height:1.1;background:#fff;box-shadow:2px 3px 0 var(--ink);transition:transform .07s}
.schamp:active{transform:translate(1px,2px) scale(.95);box-shadow:none}
.schamp canvas{width:50px;height:50px;display:block}
.schamp[aria-pressed=true],.srole button[aria-pressed=true]{background:var(--b);transform:rotate(-1.5deg) scale(1.03)}
.srole{display:grid;gap:4px;align-content:start}
.srole button{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;min-height:44px;padding:3px 10px;border:2.5px solid var(--ink);border-radius:7px;text-align:left;background:#fff;box-shadow:2px 3px 0 var(--ink);transition:transform .07s}
.srole button:active{transform:translate(1px,2px) scale(.97);box-shadow:none}
.srole b{font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.03em;font-size:17px;display:block;line-height:1.02}
.srole small{font-size:13px;font-weight:600;display:block;line-height:1.05}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;font-size:18px;font-weight:700}
.setrow .seg{color:var(--ink);text-shadow:none}

/* Match overlays */
#forge{position:absolute;left:152px;top:62px;width:min(348px,calc(100% - 363px));padding:6px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;transform:rotate(-.5deg);animation:pop .2s ease-out both}
#forge button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 8px;min-height:72px;border:2.5px solid var(--ink);border-radius:6px;text-align:left;line-height:1.05;background:#fff;box-shadow:2px 3px 0 var(--ink);transition:transform .07s}
#forge button:active{transform:translate(1px,2px) scale(.95);box-shadow:none}
#forge button:disabled{background:#d9d3c2;opacity:.8}
#forge b{font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.04em;font-size:20px;line-height:1;color:var(--a2)}
#forge small{font-size:12.5px;font-weight:600}
#forge .c{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:700;margin-top:auto}
.gc{display:block;width:13px;height:13px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.pgrid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;width:100%;max-width:760px;padding:13px 15px;max-height:100%;align-items:center;transform:rotate(-.4deg)}
.pcol{display:flex;flex-direction:column;gap:9px}
.pcol h2{font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.03em;font-size:42px;line-height:1;color:var(--b);text-shadow:var(--o3),3px 4px 0 var(--ink);transform:rotate(-3deg)}
.pcol .go{height:46px;font-size:23px}
.tog{display:flex;align-items:center;justify-content:space-between;min-height:42px;padding:0 13px;border:2.5px solid var(--ink);border-radius:7px;font-size:16px;font-weight:700;background:#fff;box-shadow:2px 3px 0 var(--ink);transition:transform .07s}
.tog:active{transform:translate(1px,2px) scale(.97);box-shadow:none}
.tog::after{content:"Off";color:#7d7690}
.tog[aria-pressed=true]::after{content:"On";color:var(--ink);background:var(--b);border:2px solid var(--ink);padding:0 8px}
.board{min-height:0;max-height:100%}
.score{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1;font-weight:700}
.score small{display:none}
.score th{font-size:13px;font-weight:700;text-align:left;padding:0 6px 3px}
.score td{padding:1px 5px;height:27px;white-space:nowrap}
.score canvas{width:24px;height:24px;display:block}
.score .n{text-align:right;font-variant-numeric:tabular-nums}
.score tbody.t0 td:first-child{box-shadow:inset 5px 0 var(--ultra)}
.score tbody.t1 td:first-child{box-shadow:inset 5px 0 var(--violet)}
.score tbody+tbody tr:first-child td{border-top:2.5px solid var(--ink)}
.score tr.me td{background:var(--b)}

/* End screen */
#end{background:repeating-conic-gradient(from 4deg at 22% 40%,var(--a) 0 9deg,var(--a2) 9deg 18deg)}
#end::before{content:"";position:absolute;inset:0;background:var(--dots);pointer-events:none}
#end.lose{filter:saturate(.82)}
#end.lose .ehead h2{color:#fff}
.egrid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.04fr);gap:18px;width:100%;max-width:820px;padding:12px 15px;max-height:100%;align-items:center;transform:rotate(-.3deg)}
.ecol{display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.ehead{display:flex;align-items:center;gap:14px;position:relative;z-index:1;margin:0 0 20px 6px}
.eburst{position:absolute;left:-34px;top:50%;width:180px;height:180px;transform:translateY(-50%);clip-path:var(--star);background:var(--ink)}
.eburst::after{content:"";position:absolute;inset:7px;clip-path:var(--star);background:var(--b)}
.eburst{animation:burstin .34s ease-out both}
@keyframes burstin{0%{transform:translateY(-50%) scale(.3) rotate(-40deg)}60%{transform:translateY(-50%) scale(1.12) rotate(6deg)}100%{transform:translateY(-50%)}}
#endcoin{position:relative;width:112px;height:112px;flex:none;display:block}
.ehead>div:last-child{position:relative;min-width:0;padding-left:10px}
.ehead h2{font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.03em;font-size:44px;line-height:.95;white-space:nowrap;color:var(--b);text-shadow:var(--o3),4px 5px 0 var(--ink);transform:rotate(-3deg);animation:slam .38s .08s both}
#endW{font-size:19px;font-weight:700;color:var(--ink);line-height:1.1;margin-top:3px}
#endS{font-size:15.5px;line-height:1.15;font-weight:600;position:relative;z-index:1}
#endM,.prof,.row{position:relative;z-index:1}
.prof{height:16px;border:3px solid var(--ink);background:#fff;overflow:hidden;position:relative;box-shadow:2px 3px 0 var(--ink)}
.prof b{display:block;height:100%;background:var(--a)}
#endM{font-size:16px;font-weight:700;line-height:1.15}
.row{display:flex;gap:10px;align-items:center}
.row .go{height:46px;font-size:22px;padding:0 18px}
#tierup{position:absolute;left:92px;top:-10px;padding:5px 12px 4px;background:var(--b);border:3px solid var(--ink);box-shadow:3px 4px 0 var(--ink);font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.04em;font-size:25px;line-height:1;color:var(--ink);transform:rotate(-6deg);z-index:2;animation:tier .46s ease-out both}
@keyframes tier{0%{transform:scale(3) rotate(-18deg);opacity:0}45%{transform:scale(.9) rotate(-4deg);opacity:1}75%{transform:scale(1.12) rotate(-7deg)}100%{transform:rotate(-6deg)}}

/* The coin flip */
#flip{position:absolute;inset:0;z-index:44;cursor:pointer;touch-action:none}
#flip canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#flip.out{animation:flipout .24s ease-in forwards}
@keyframes flipout{to{transform:translateX(-108%) skewX(-10deg)}}

/* Versus splash */
#vs{position:absolute;inset:0;z-index:46;overflow:hidden;background:transparent}
.vside{position:absolute;inset:0;overflow:hidden}
.vside::before{content:"";position:absolute;inset:0;background:var(--dots);opacity:.75}
.v0{clip-path:polygon(0 0,61% 0,39% 100%,0 100%);background:repeating-conic-gradient(from 4deg at 20% 30%,var(--ultra) 0 9deg,var(--ultra2) 9deg 18deg);animation:vin0 .28s cubic-bezier(.2,.8,.3,1) both}
.v1{clip-path:polygon(61% 0,100% 0,100% 100%,39% 100%);background:repeating-conic-gradient(from 4deg at 80% 70%,var(--violet) 0 9deg,var(--violet2) 9deg 18deg);animation:vin1 .28s cubic-bezier(.2,.8,.3,1) both}
@keyframes vin0{from{transform:translateX(-101%)}}
@keyframes vin1{from{transform:translateX(101%)}}
#vs.out .v0{animation:vout0 .28s ease-in forwards}
#vs.out .v1{animation:vout1 .28s ease-in forwards}
@keyframes vout0{to{transform:translateX(-101%)}}
@keyframes vout1{to{transform:translateX(101%)}}
.vslash{position:absolute;inset:0;background:var(--ink);clip-path:polygon(59.4% 0,62.6% 0,40.6% 100%,37.4% 100%);animation:fadein .1s .24s both}
.vslash::after{content:"";position:absolute;inset:0;background:#fff;clip-path:polygon(60.4% 0,61.6% 0,39.6% 100%,38.4% 100%)}
#vs.out .vslash,#vs.out .vmark,#vs.out .vburst{animation:fadeout .12s forwards}
@keyframes fadeout{to{opacity:0}}
.vside h2{position:absolute;font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.04em;line-height:1;font-size:50px;text-shadow:var(--o3),4px 5px 0 var(--ink)}
.v0 h2{left:48px;top:6px;color:var(--sun);transform:rotate(-3deg);transform-origin:left}
.v1 h2{right:50px;bottom:12px;color:var(--toxic);transform:rotate(-3deg);transform-origin:right}
.vgrid{position:absolute;display:grid;grid-template-columns:repeat(2,minmax(0,150px));gap:4px 4px}
.v0 .vgrid{left:44px;top:60px}
.v1 .vgrid{right:44px;bottom:66px}
.vcell{display:flex;flex-direction:column;align-items:center;gap:0;animation:vcoin0 .32s cubic-bezier(.2,1.35,.4,1) both;animation-delay:calc(.3s + var(--i)*.07s);text-align:center}
.v1 .vcell{animation-name:vcoin1}
@keyframes vcoin0{from{transform:translateX(-180px) rotate(-50deg) scale(.6);opacity:0}}
@keyframes vcoin1{from{transform:translateX(180px) rotate(50deg) scale(.6);opacity:0}}
.vcell canvas{width:84px;height:84px;display:block}
.vcell b{font-family:var(--disp);font-weight:700;font-synthesis:none;text-transform:uppercase;letter-spacing:.03em;font-size:17px;line-height:1;color:#fff;text-shadow:var(--o2),2px 3px 0 var(--ink);max-width:140px}
.vcell i{font-style:normal;font-size:12px;font-weight:700;padding:0 6px;background:var(--sun);color:var(--ink);border:2px solid var(--ink);line-height:1.2;transform:rotate(-3deg);margin-top:1px}
.vburst{position:absolute;left:50%;top:50%;width:210px;height:210px;margin:-105px 0 0 -105px;clip-path:var(--star);background:var(--ink);animation:vstar .32s .32s cubic-bezier(.2,1.5,.4,1) both}
.vburst::after{content:"";position:absolute;inset:7px;clip-path:var(--star);background:var(--sun)}
@keyframes vstar{from{transform:scale(0) rotate(-60deg)}}
.vmark{position:absolute;left:50%;top:50%;font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:92px;line-height:1;letter-spacing:.02em;color:#fff;text-shadow:4px 0 0 var(--ink),-4px 0 0 var(--ink),0 4px 0 var(--ink),0 -4px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),6px 7px 0 var(--ink);transform:translate(-50%,-52%) rotate(-8deg);animation:vmark .4s .34s both}
@keyframes vmark{0%{transform:translate(-50%,-52%) scale(4) rotate(-22deg);opacity:0}40%{opacity:1}55%{transform:translate(-50%,-52%) scale(.88) rotate(-5deg)}75%{transform:translate(-50%,-52%) scale(1.09) rotate(-9deg)}100%{transform:translate(-50%,-52%) rotate(-8deg)}}
#vs{animation:vshake .28s .46s linear}
@keyframes vshake{20%{transform:translate(9px,-7px)}40%{transform:translate(-8px,6px)}60%{transform:translate(6px,5px)}80%{transform:translate(-4px,-3px)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Short and narrow phones. Set from JS because the stage may be rotated. */
.sm #lobby{grid-template-columns:minmax(0,124px) minmax(0,1fr) 200px;grid-template-rows:38px minmax(0,1fr) 60px;gap:4px 10px;padding:6px 44px}
.sm .ltop{gap:7px}
.sm .ltop h1{font-size:23px}
.sm .mission b{font-size:16px;padding:3px 6px 2px}
.sm .mission span{display:none}
.sm .seg{font-size:13.5px}.sm .seg>span{display:none}
.sm .seg button{min-width:38px;padding:0 5px}
.sm .tok{padding:0 8px;font-size:14px}
.sm .hero canvas#big{height:100%;transform:translate(-50%,-52%)}
.sm .rung{width:20px;height:20px;padding:1.5px}
.sm .ladder{gap:1px}
.sm .herotag{padding:2px 6px 3px}
.sm .lad{font-size:11.5px}
.sm .nm h2{font-size:30px}.sm .nm h2.long{font-size:22px}
.sm .nmsub{display:none}
.sm .blurb{display:none}
.sm .tags span{font-size:11.5px;padding:0 5px}
.sm .abilbox{padding:4px 6px}
.sm .abil>div{grid-template-columns:27px minmax(0,1fr);font-size:11.5px;gap:5px;line-height:1.03}
.sm .abil img{width:27px;height:27px;border-width:2px}
.sm .abil em{font-size:13.5px}.sm .abil u{display:none}
.sm .stats{display:none}
.sm .picks{gap:5px;padding:1px 6px}
.sm .pick{width:54px;padding:0}
.sm .pick canvas{width:40px;height:40px}
.sm .pick .pips i{width:7px;height:7px;border-width:1.5px}
.sm .side{gap:5px}
.sm .team{padding:3px 4px 4px}
.sm .team h3{font-size:14px;margin-bottom:1px}
.sm .seatc{width:38px;height:38px}
.sm .chip{font-size:11px}
.sm .sit,.sm .you{font-size:11px;height:26px;line-height:21px;padding:0}
.sm .acts .go{font-size:19px;height:46px}
.sm .acts .ghost{width:76px;min-height:46px;font-size:12.5px}

.sm .tword em{font-size:18px;padding:7px 12px 6px}
.sm .schamp canvas{width:40px;height:40px}
.sm .srole button{min-height:40px}
.sm .srole small{font-size:12px}
.sm .sheet{padding:7px 11px;gap:4px}
.sm .shead h3{font-size:22px}
.sm #endcoin{width:84px;height:84px}
.sm .eburst{left:-24px}
.sm .eburst{width:132px;height:132px}
.sm .ehead{margin-bottom:12px}
.sm .ehead h2{font-size:34px}
.sm #endW{font-size:15px}
.sm #endS{font-size:13.5px}
.sm .score{font-size:13px}
.sm .score td{height:24px;padding:0 4px}
.sm .score canvas{width:20px;height:20px}
.sm .pcol h2{font-size:30px}
.sm .pgrid{grid-template-columns:150px minmax(0,1fr);gap:10px;padding:8px 11px}
.sm .tog{min-height:42px}
.sm .egrid{gap:10px;padding:8px 11px}
.sm .vside h2{font-size:36px}
.sm .v0 .vgrid{top:44px}.sm .v1 .vgrid{bottom:50px}
.sm .vcell canvas{width:66px;height:66px}
.sm .vcell b{font-size:13px;max-width:102px}
.sm .vgrid{grid-template-columns:repeat(2,minmax(0,104px))}
.sm .vmark{font-size:58px}.sm .vburst{width:130px;height:130px;margin:-65px 0 0 -65px}
#wipe{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:50}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="forge" class="plate hide" role="group" aria-label="Upgrades"></div>

  <div id="pause" class="over hide" role="dialog" aria-label="Paused">
    <div class="plate pgrid">
      <div class="pcol">
        <h2>Paused</h2>
        <button class="go" id="resume">Resume</button>
        <button class="ghost" id="leave">Leave match</button>
        <button class="tog" id="pMusic">Music</button>
        <button class="tog" id="pSfx">Effects</button>
      </div>
      <div class="board scroll" id="pBoard"></div>
    </div>
  </div>

  <div id="end" class="over hide" role="dialog" aria-label="Match result">
    <div class="plate egrid">
      <div class="ecol">
        <div id="tierup" class="hide"></div>
        <div class="ehead"><span class="eburst"></span><canvas id="endcoin" width="300" height="300"></canvas><div><h2 id="endT"></h2><p id="endW"></p></div></div>
        <p id="endS"></p>
        <div class="prof"><b id="endBar"></b></div>
        <p id="endM"></p>
        <div class="row"><button class="go" id="again">Play again</button><button class="ghost" id="tolobby">Back to lobby</button></div>
      </div>
      <div class="board scroll" id="eBoard"></div>
    </div>
  </div>

  <div id="lobby" class="hide">
    <div class="ltop">
      <h1>Flipside</h1>
      <p class="mission" id="mission"></p>
      <div>
        <div class="seg" id="diff"><span>Bots</span><button data-d="easy">Easy</button><button data-d="normal">Normal</button><button data-d="hard">Hard</button></div>
        <button class="tok" id="openSet">Settings</button>
      </div>
    </div>
    <div class="hero"><canvas id="big" width="520" height="520"></canvas><div class="herotag"><div class="ladder" id="ladder"></div><p class="lad" id="wTier"></p></div></div>
    <div class="who">
      <div class="nm"><h2 id="wN"></h2><div class="nmsub"><p class="blurb" id="wB"></p><div class="tags" id="wT"></div></div></div>
      <div class="abilbox"><div class="abil" id="wA"></div><div class="stats" id="wS"></div></div>
    </div>
    <div class="picks" id="picks"></div>
    <div class="side">
      <div class="team t0"><h3>Heroes</h3><div class="seats" id="s0"></div></div>
      <div class="team t1"><h3>Villains</h3><div class="seats" id="s1"></div></div>
      <div class="acts"><button class="ghost" id="auto">Auto-fill roles</button><button class="go" id="start">Start match</button></div>
    </div>
  </div>

  <div id="vs" class="hide"><div class="vside v0"><h2>Heroes</h2><div class="vgrid" id="vs0"></div></div><div class="vside v1"><h2>Villains</h2><div class="vgrid" id="vs1"></div></div><div class="vslash"></div><div class="vburst"></div><div class="vmark">VS</div></div>
  <div id="flip" class="hide" role="button" tabindex="0" aria-label="Skip the coin flip"><canvas id="fcan"></canvas><p class="sr" id="flipT" aria-live="polite"></p></div>

  <div id="sheet" class="over hide" role="dialog" aria-label="Seat setup">
    <div class="plate sheet scroll">
      <div class="shead"><h3 id="shT"></h3><button class="ghost" id="shSit">Sit here</button><button class="go" id="shDone">Done</button></div>
      <div class="sbody"><div class="spick" id="shC"></div><div class="srole" id="shR"></div></div>
    </div>
  </div>

  <div id="settings" class="over hide" role="dialog" aria-label="Settings">
    <div class="plate sheet scroll" style="max-width:400px">
      <div class="shead"><h3>Settings</h3><button class="go" id="setDone">Done</button></div>
      <button class="tog" id="sMusic">Music</button>
      <button class="tog" id="sSfx">Effects</button>
      <div class="setrow"><span>Graphics</span><div class="seg" id="gfx"><button data-g="auto">Auto</button><button data-g="high">High</button><button data-g="low">Low</button></div></div>
    </div>
  </div>

  <button id="title" aria-label="Tap to flip"><canvas id="tcan"></canvas><span class="tword"><b>Flipside</b><em>Tap to flip</em></span></button>
  <canvas id="wipe" class="hide"></canvas>
</div>
<script>/*SIM*/</script>
<script>/*ART*/</script>
<script>/*AUDIO*/</script>
<script>/*CLIENT*/</script>
</body>
</html>
